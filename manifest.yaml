notes:
  - "This manifest pins the current repo surfaces: repo skills, agents and the runtime package are rendered by scripts/render_agent_kit.py. Every path is where a file lands. Skills and agents land in gitignored directories, so each of their entries also names its `source` under skills/repo/ or agents/, and the sha256 pins that source. installer/setup-workstation.sh is a SEPARATE artifact, rendered from registry/estate-tooling.yaml by scripts/render_registry.py and verified by its own --check; this manifest does not pin it."
  - "The estate ships exactly three agent hooks, the critique hooks docs/adr/0002-exactly-three-critique-hooks.md allows: critique-commit-gate, critique-pr-gate and critique-session-start. The validator fails on any other name; a new hook needs its own ADR. The knowledge-recall hooks (edit recall, git-commit capture, session digest) stay retired with the knowledge base they wrote into, and setup-workstation.sh still purges them from an existing settings.json (agent-kit#40 moved this off the retired install-agents.sh)."
  - "Repo skill bodies are intentionally agent-specific today; parity means every shared skill has both Claude and Codex targets unless an explicit unsupported reason is present."

