# topics and audit were installer-only skills (no repo template, served only
# by the retired install.sh's KB-curator partials) and are removed along with
# it (agent-kit#40): both are built around the old knowledge service's admin tools with no
# memory-api equivalent, so nothing replaces them. See the
# agent-kit#40 PR body.

# hooks: the three critique hooks ADR-0002 allows, and the projects-layout
# guard ADR-0009 allows.
#
# The three knowledge-recall hooks that used to live here were retired with
# the knowledge base they wrote into, and setup-workstation.sh still purges
# them from Claude's settings.json and Codex's hooks.json. ADR-0002 lifts
# the no-hooks rule for these three names only; scripts/validate_manifest.py
# fails on any other name, and a new hook needs its own ADR. Setup installs
# them into the Claude Code and Codex homes only.
hooks:
  critique-commit-gate:
    adr: docs/adr/0002-exactly-three-critique-hooks.md
    event: PreToolUse
    agents: [claude, codex]
    purpose: Block a risky staged diff before `git commit` until a passing /review-implementation run matches it.
  critique-pr-gate:
    adr: docs/adr/0002-exactly-three-critique-hooks.md
    event: PreToolUse
    agents: [claude, codex]
    purpose: Block `gh pr create`, or a push outside the feature branch patterns, unless /review-pr passed for the head.
  critique-session-start:
    adr: docs/adr/0002-exactly-three-critique-hooks.md
    event: SessionStart
    agents: [claude, codex]
    purpose: Print one line suggesting /flow setup in an opted-in repository whose machine setup is missing or failing.
  projects-layout-guard:
    adr: docs/adr/0009-projects-layout-guard.md
    event: PreToolUse
    matcher:
      claude: Bash|EnterWorktree
      codex: Bash
    skill: projects-layout
    agents: [claude, codex]
    purpose: Deny a clone or worktree outside ~/Projects/<owner>/<repo> and ~/Projects/<owner>/worktrees/<repo>/<name>.

# settings: intentionally absent. The only settings files the kit ever
# pinned (.claude/settings.json, .codex/hooks.json) existed solely to wire the
# retired hooks; setup merges the critique hooks into the operator's own
# files by name instead.


