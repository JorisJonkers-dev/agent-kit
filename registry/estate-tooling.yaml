# `nixos-modules#<name>` for a package nixos-modules provides itself.
# `group:` is core (always installed) or one of the optional groups
# kubernetes, latex, polyglot, android. A language server with a `nixos:`
# key is in the list too, its group from `nixos_group` (core by default).
