# Estate tooling registry — the ONE file to edit.
#
# Everything an estate agent surface gets is declared here once:
# CLIs, Claude Code marketplaces and plugins, language servers, vendored
# third-party skills, and MCP servers. Three artifacts are GENERATED from
# it and must never be hand-edited:
#
#   installer/setup-workstation.sh            local machine (Claude Code + Codex)
#   installer/setup-container.sh              the agents image, at build time
#   registry/generated/hermes/skills-sources.conf   Hermes `sources.conf` body
#   registry/generated/hermes/mcp-servers.yaml      Hermes `mcp_servers:` block
#
# Regenerate and verify:
#
#   uv run python scripts/render_registry.py --write
#   uv run python scripts/render_registry.py --check    # CI gate
#
# `surfaces:` is what makes one edit reach every agent. Valid values:
#
#   workstation   this laptop: Claude Code and Codex through setup-workstation.sh
#   hermes        the in-cluster Hermes gateway
#   runner        the per-workspace agent-runner image
#   container     the agents image, through setup-container.sh
#
# `cloud: false` keeps a workstation entry out of `setup-workstation.sh
# --cloud`, the Claude Code cloud environment run (see docs/CLOUD.md).
#
# Container pins are exact; keep datasource, package, version in that order
# (Renovate reads them as one match). See docs/REGISTRY.md.
#
# PINS ARE COMMIT SHAs, NOT TAG SHAs. Hermes' sync-skills init container
# fetches each source by its commit (`git fetch --depth 1 <url> <sha>`) and
# checks out FETCH_HEAD, so the sha alone decides what is installed. For a
# tag ref it also requires the PEELED tag to equal the sha:
#
#   git ls-remote https://github.com/<owner>/<repo> 'refs/tags/<tag>^{}'
#
# Every tag here is annotated, so the unpeeled `refs/tags/<tag>` is the TAG
# OBJECT, not the commit: always pin the peeled value. A moved tag is a
# supply-chain event, so the mismatch failing loudly is the point. For a
# source with no usable tags, pin `main` plus the commit: upstream pushing to
# `main` does not matter, because Hermes fetches the sha, not the branch tip.

version: 1
verified_at: 2026-09-09

# -------------------------------------------------------------------
# Workstation tokens and keys.
#
# What setup gets for you through scripts/agent-kit-keys.py: a `grant`
# entry is a service token it mints from auth-api after signing you in
# (granting the service first when you are an admin), a `paste` entry is a
# key you paste once, a `login` entry is one a sign-in command gets for you
# (setup only says which), and a `value` entry is a fixed setting. Each is
# checked against `check` and stored in the keychain;
# ~/.config/agent-kit/env.sh reads them back in every shell. `export:
# false` keeps a value out of the shell: only vibe-private (the Private
# Memory token, through the passphrase gate) and vibe-study (the Study
# account key) get one.
# -------------------------------------------------------------------
claude_private_deny:
  # vibe-private's Vibe home holds its session logs: the private conversations
  # themselves. The shared home held them before the split, so it stays denied.
  - "Read(~/.vibe/**)"
  - "Edit(~/.vibe/**)"
  - "Read(~/.vibe-private/**)"
  - "Edit(~/.vibe-private/**)"
  # Covers both homes' paths (~/.vibe, ~/.vibe-private) but not the kit's own
  # files, so agent-kit stays maintainable from Claude Code.
  - "Bash(*.vibe*)"
  # The sealed private-bank token, and the command that opens it.
  - "Read(~/.config/agent-kit/private/**)"
  - "Edit(~/.config/agent-kit/private/**)"
  - "Bash(*agent-kit/private*)"
  - "Bash(*agent-kit-private*)"

workstation_secrets:
  - env: HINDSIGHT_API_URL
    value: "https://hindsight-api.jorisjonkers.dev"
    export: true
  - env: HINDSIGHT_API_TOKEN
    grant: MEMORY_API
    check: "https://hindsight-api.jorisjonkers.dev/mcp/default/"
    export: true
  # Retired with the memory-mcp server: Basic Memory is parked at zero
  # replicas (fleet-infra). Removed from the keychain and env.sh.
  - env: MEMORY_MCP_TOKEN
    retired: true
  - env: MEMORY_PRIVATE_TOKEN
    grant: MEMORY_PRIVATE
    check: "https://hindsight-private.jorisjonkers.dev/mcp/private/"
    export: false
    # Sealed behind a passphrase only you know (installer/agent-kit-private),
    # asked at each vibe-private launch: no other agent can fetch it.
    gate: passphrase
  # Retired: Vibe signs in with your Mistral account, and an exported key
  # would override that login. Removed from the keychain and env.sh.
  - env: MISTRAL_API_KEY
    retired: true
  # The Study account's key, minted by Vibe's own browser sign-in through
  # `vibe-study --login` (there is no key to paste). Unexported, so plain vibe
  # keeps the personal login; vibe-study hands it to Vibe as MISTRAL_API_KEY.
  - env: MISTRAL_STUDY_API_KEY
    login: "vibe-study --login"
    check: "https://api.mistral.ai/v1/models"
    check_method: GET
    export: false

# -------------------------------------------------------------------
# Claude Code profiles.
#
# One login per profile. CLAUDE_CONFIG_DIR moves the WHOLE config root,
# so a second profile is a second directory: separate credentials,
# separate `projects/`, `history.jsonl`, `sessions/` and `.claude.json`.
# That separation is the point -- a personal conversation must not land
# in the work account's history, and vice versa.
#
# What every profile shares is declared per profile in `shared_paths:`,
# and shared by SYMLINK back into the primary. The primary keeps the
# default location, so a bare `claude` with no environment set is the
# primary profile and nothing has to be remembered for the common case.
#
# `shared_paths:` may not name per-profile state. Sharing `projects/`,
# `history.jsonl`, `sessions/` or `.claude.json` would merge the two
# histories back together and hand each account the other's transcripts,
# so the renderer rejects them rather than trusting the edit.
#
# Plugins install once, into the primary: `plugins/` is shared, and
# `settings.json` (shared too) is where `enabledPlugins` lives. MCP
# servers are NOT shared -- they live in each profile's own
# `.claude.json` -- so setup registers the fleet once per profile.
# -------------------------------------------------------------------
claude_profiles:
  - name: work
    primary: true
    # The default location. `CLAUDE_CONFIG_DIR` still overrides it, which
    # is what lets a throwaway root be set up without touching this one.
    config_dir: "${CLAUDE_CONFIG_DIR:-$HOME/.claude}"
    purpose: >-
      The default profile a bare `claude` uses, and the home of every
      shared asset the other profiles link back to.

  - name: personal
    config_dir: "$HOME/.claude-personal"
    shares_from: work
    # hooks/ is shared because settings.json is: a hook command there is
    # an absolute path into the primary's tree, so splitting the two
    # leaves the secondary profile wired to scripts it cannot see.
    shared_paths: [skills, agents, commands, hooks, plugins, settings.json]
    purpose: >-
      The personal-account profile. Same skills, plugins, LSPs and MCP
      fleet as work; its own login and its own conversation history.

# -------------------------------------------------------------------
# Container base. Debian packages follow the base image's release.
# No Docker CLI: the agents container has no Docker socket (agents-api ADR 0001).
# -------------------------------------------------------------------
container_base:
  # Shared, world-readable install locations for the non-root agent user.
  environment:
    UV_TOOL_DIR: /opt/uv/tools
    UV_TOOL_BIN_DIR: /usr/local/bin
    UV_PYTHON_INSTALL_DIR: /opt/uv/python
    PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
  readable_paths: [/opt/uv, /ms-playwright]
  # Needed to add the apt repositories below.
  apt_bootstrap: [ca-certificates, curl, gnupg]
  apt_repositories:
    - name: adoptium
      key_url: https://packages.adoptium.net/artifactory/api/gpg/key/public
      url: https://packages.adoptium.net/artifactory/deb
      components: main
  apt_packages:
    - bash
    - bat
    - bubblewrap  # Codex's sandbox
    - build-essential
    - clangd
    - fd-find
    - git
    - jq
    - less
    - openssh-client
    - procps
    - python3
    - python3-pip
    - python3-venv
    - ripgrep
    - temurin-21-jdk
    - tini
    - tmux
    - unzip
    - xz-utils
    - zsh

# -------------------------------------------------------------------
# Command-line tools.
#
# `latest: true` means the setup script installs or upgrades to the
# newest release on every run rather than pinning. That is deliberate for
# the three agent CLIs — they ship fast and an old Claude Code is the most
# common cause of "that feature does not exist here".
# -------------------------------------------------------------------
clis:
  - name: claude-code
    binary: claude
    purpose: Claude Code CLI.
    latest: true
    surfaces: [workstation, container]
    # The native installer owns ~/.local/bin/claude and self-updates.
    # Do NOT `npm i -g @anthropic-ai/claude-code` on top of it: two
    # installs on one PATH is how a stale binary wins.
    install: "curl -fsSL https://claude.ai/install.sh | bash"
    update: "claude update"
    version_command: "claude --version"
    # The cloud host installs and updates Claude Code itself.
    cloud: false
    # Container uses npm: the native installer writes into root's home.
    container:
      datasource: npm
      package: "@anthropic-ai/claude-code"
      version: "2.1.272"
      install: 'npm install -g "@anthropic-ai/claude-code@${VERSION}"'
      requires: [node]

  - name: codex
    binary: codex
    purpose: OpenAI Codex CLI, the second engine council fans out to.
    latest: true
    surfaces: [workstation, container]
    install: "npm install -g @openai/codex@latest"
    update: "npm install -g @openai/codex@latest"
    version_command: "codex --version"
    container:
      datasource: npm
      package: "@openai/codex"
      version: "0.154.0"
      install: 'npm install -g "@openai/codex@${VERSION}"'
      requires: [node]

  - name: hermes-agent
    binary: hermes
    purpose: >-
      Nous Research Hermes Agent. Installed on the workstation for
      `hermes doctor` / `hermes skills list` against a local config; the
      in-cluster gateway runs the container image, not this.
    latest: true
    surfaces: [workstation, container]
    # uv tool, not pip: hermes-agent needs >=3.11,<3.14 and a shared
    # site-packages is how a version conflict takes out both tools.
    # The `[mcp]` extra is what lets LOCAL hermes run any MCP server at
    # all (it is a no-op otherwise); install it up front so the local
    # `mcp` CLI can actually register and connect servers.
    install: "uv tool install --python '>=3.11,<3.14' 'hermes-agent[mcp]'"
    update: "uv tool upgrade 'hermes-agent[mcp]'"
    version_command: "hermes --version"
    requires: [uv]
    # CLI only in the container; Agent Sessions use the in-cluster Hermes.
    container:
      datasource: pypi
      package: "hermes-agent"
      version: "0.19.0"
      install: 'uv tool install --python 3.13 "hermes-agent[mcp]==${VERSION}"'
      requires: [uv]

  - name: mistral-vibe
    binary: vibe
    purpose: >-
      Mistral Vibe, the agent for personal notes. Gets the estate MCP
      servers, skills and AGENTS.md pointer like Claude Code and Codex; its
      MCP servers are merged into ~/.vibe/config.toml from
      registry/generated/vibe/mcp-servers.toml.
    latest: true
    surfaces: [workstation]
    # uv tool for its own interpreter: mistral-vibe needs Python 3.12+.
    install: "uv tool install --python '>=3.12' mistral-vibe"
    update: "uv tool upgrade mistral-vibe"
    version_command: "vibe --version"
    requires: [uv]

  - name: antigravity-cli
    binary: agy
    cask: antigravity-cli
    purpose: >-
      Google Antigravity CLI (`agy`). Gets the workstation MCP fleet minus
      Private Memory, the agent-kit instructions pointer and the kit's skills.
    surfaces: [workstation]
    macos_only: true
    # A cloud host is Linux and has no Homebrew; the cask is a workstation thing.
    cloud: false
    version_command: "agy --version"

  - name: antigravity
    cask: antigravity
    purpose: >-
      Google Antigravity, the desktop agent manager. Same configuration as the
      CLI: one global MCP file, one global rules file, and the kit's skills in
      each of the two global skills folders.
    surfaces: [workstation]
    macos_only: true
    cloud: false

  - name: olcli
    binary: olcli
    purpose: >-
      Overleaf CLI and MCP server. Points at the estate's self-hosted
      Overleaf, not overleaf.com.
    latest: true
    surfaces: [workstation, hermes, container]
    install: "npm install -g @aloth/olcli@latest"
    update: "npm install -g @aloth/olcli@latest"
    version_command: "olcli --version"
    # Also provides the olcli-mcp and git-remote-overleaf binaries.
    provides_binaries: [olcli, olcli-mcp, git-remote-overleaf]
    container:
      datasource: npm
      package: "@aloth/olcli"
      version: "0.13.0"
      install: 'npm install -g "@aloth/olcli@${VERSION}"'
      requires: [node]

  - name: uv
    binary: uv
    purpose: Python tool/venv manager; prerequisite for hermes-agent and the kit's own tooling.
    latest: true
    surfaces: [workstation, container]
    install: "curl -fsSL https://astral.sh/uv/install.sh | sh"
    # A Homebrew uv refuses `self update`; Homebrew updates it instead.
    update: "uv self update 2>/dev/null || brew upgrade uv 2>/dev/null || true"
    version_command: "uv --version"
    container:
      datasource: github-releases
      package: "astral-sh/uv"
      version: "0.12.15"
      install: >-
        curl -fsSL "https://github.com/astral-sh/uv/releases/download/${VERSION}/uv-${GNU_ARCH}-unknown-linux-gnu.tar.gz"
        | tar -xz -C /usr/local/bin --strip-components=1 --wildcards '*/uv' '*/uvx'

  # --- Container-only tools. The workstation brings its own. ---

  - name: node
    binary: node
    purpose: Node.js runtime; every npm-installed tool in the image needs it.
    surfaces: [container]
    install: null
    version_command: "node --version"
    container:
      datasource: node-version
      package: "node"
      version: "22.23.2"
      install: >-
        curl -fsSL "https://nodejs.org/dist/v${VERSION}/node-v${VERSION}-linux-${DEB_ARCH/amd64/x64}.tar.xz"
        | tar -xJ -C /usr/local --strip-components=1 --exclude='*.md' --exclude=LICENSE --exclude=share/doc

  - name: gh
    binary: gh
    purpose: GitHub CLI.
    surfaces: [container]
    install: null
    version_command: "gh --version"
    container:
      datasource: github-releases
      package: "cli/cli"
      version: "v2.100.0"
      install: >-
        curl -fsSL "https://github.com/cli/cli/releases/download/${VERSION}/gh_${VERSION#v}_linux_${DEB_ARCH}.tar.gz"
        | tar -xz -C /usr/local --strip-components=1 "gh_${VERSION#v}_linux_${DEB_ARCH}/bin/gh"

  - name: go
    binary: go
    purpose: Go toolchain, world-readable under /usr/local/go.
    surfaces: [container]
    install: null
    version_command: "go version"
    container:
      datasource: golang-version
      package: "go"
      version: "1.27.1"
      install: >-
        curl -fsSL "https://go.dev/dl/go${VERSION}.linux-${DEB_ARCH}.tar.gz" | tar -xz -C /usr/local
        && ln -sf /usr/local/go/bin/go /usr/local/go/bin/gofmt /usr/local/bin/

  - name: mise
    binary: mise
    purpose: Polyglot runtime manager, for toolchains a repository pins itself.
    surfaces: [container]
    install: null
    version_command: "mise --version"
    container:
      datasource: github-releases
      package: "jdx/mise"
      version: "v2026.9.9"
      install: >-
        curl -fsSL -o /usr/local/bin/mise
        "https://github.com/jdx/mise/releases/download/${VERSION}/mise-${VERSION}-linux-${DEB_ARCH/amd64/x64}"
        && chmod 755 /usr/local/bin/mise

  - name: ast-grep
    binary: ast-grep
    purpose: Structural search and rewrite.
    surfaces: [container]
    install: null
    version_command: "ast-grep --version"
    container:
      datasource: npm
      package: "@ast-grep/cli"
      version: "0.45.3"
      install: 'npm install -g "@ast-grep/cli@${VERSION}"'
      requires: [node]

  - name: typescript
    # tsserver, not tsc: typescript-language-server needs it, and 7.x ships none.
    binary: tsserver
    purpose: TypeScript compiler and tsserver; typescript-language-server drives it.
    surfaces: [container]
    install: null
    version_command: "tsc --version"
    container:
      datasource: npm
      package: "typescript"
      version: "5.9.3"
      install: 'npm install -g "typescript@${VERSION}"'
      requires: [node]

  - name: github-mcp-server
    binary: github-mcp-server
    purpose: GitHub's stdio MCP server; its token arrives at session start, never at build.
    surfaces: [container]
    install: null
    version_command: "github-mcp-server --version"
    container:
      datasource: github-releases
      package: "github/github-mcp-server"
      version: "v1.12.1"
      install: >-
        case "${DEB_ARCH}" in amd64) a=x86_64 ;; arm64) a=arm64 ;; esac
        && curl -fsSL "https://github.com/github/github-mcp-server/releases/download/${VERSION}/github-mcp-server_Linux_${a}.tar.gz"
        | tar -xz -C /usr/local/bin github-mcp-server

  - name: serena
    binary: serena
    purpose: LSP-backed semantic code intelligence MCP server.
    surfaces: [container]
    install: null
    version_command: "serena --version"
    container:
      datasource: pypi
      package: "serena-agent"
      version: "1.7.0"
      install: 'uv tool install --python 3.13 "serena-agent==${VERSION}"'
      requires: [uv]

# -------------------------------------------------------------------
# Claude Code plugin marketplaces.
# -------------------------------------------------------------------
# Each marketplace is pinned to a REVIEWED commit. Setup checks it out in
# ~/.local/share/agent-kit/marketplaces/<name> and declares the marketplace
# from that folder, so it holds still: a plugin in the marketplace's repo
# installs at this commit, and an external plugin at the sha its entry in
# that commit pins. A pin is deliberately NOT what happens to be installed:
# recording that would turn the drift check into a mirror. Where a skill
# source wraps the same upstream (caveman, drawio, kubernetes-skill), the two
# pins must agree, ref and commit both.
#
# Renovate moves `commit` to the newest commit on `ref` (a branch) or to the
# newest tag (a tag ref). The Marketplace Pin Review check fails a bump that
# adds a hook, an MCP or LSP server, or a script to a plugin installed from
# it, and a failing check stops the automerge until a person reviews it.
marketplaces:
  - name: claude-plugins-official
    repo: anthropics/claude-plugins-official
    ref: main
    commit: ea10b213686c90bb1984b2016937310e05336cf3
    # Claude Code reserves this name for GitHub sources, so the pinned folder is
    # declared under another name and its plugins install as <plugin>@agent-kit-official.
    declare_as: agent-kit-official
  - name: caveman
    repo: JuliusBrussee/caveman
    ref: v2.6.0
    commit: b82c0ad42c2bedc1f2cd78e414dadfaffbaaeec3
  - name: drawio
    repo: jgraph/drawio-mcp
    ref: main
    commit: 30c232a35a924e193cd419013b3deb35536ec79b
  - name: kubernetes-skill
    repo: LukasNiessen/kubernetes-skill
    ref: main
    commit: 34f93c1e409156958cc7c410ab1aa88ab512f10f
  - name: ai-software-architect
    repo: codenamev/ai-software-architect
    ref: main
    commit: 3f030c1e3f1568e9509251d2c24290392cdcd4e1

# -------------------------------------------------------------------
# Claude Code plugins.
#
# `enabled: false` installs the plugin but leaves it off, which is how
# a plugin stays available to turn on without spending prompt budget on
# its skill metadata in every session.
#
# A plugin is pinned through its marketplace (above), never on its own: the
# marketplace commit decides the commit every plugin in it installs at.
# -------------------------------------------------------------------
plugins:
  - name: caveman
    marketplace: caveman
    enabled: true
    purpose: Compressed output mode plus the cavecrew subagents.

  - name: drawio
    marketplace: drawio
    enabled: true
    purpose: Native .drawio diagram authoring and export.

  - name: frontend-design
    marketplace: claude-plugins-official
    enabled: true
    purpose: Visual design guidance for new UI work.

  - name: mattpocock-skills
    marketplace: claude-plugins-official
    enabled: true
    purpose: TDD, code review, domain modelling, grilling.

  - name: security-guidance
    marketplace: claude-plugins-official
    enabled: true
    purpose: >-
      Security review of generated code. Ships its own PreToolUse and Stop
      hooks. Those are the PLUGIN's hooks, not estate hooks — the retired
      knowledge hooks are unrelated and the purge step matches on their
      script basenames, so this plugin's hooks survive it.

  - name: kubernetes-skill
    marketplace: kubernetes-skill
    enabled: true
    purpose: Manifest and cluster failure-mode guidance.

  - name: github
    marketplace: claude-plugins-official
    enabled: true
    # Cloud sessions reach GitHub through the host's own proxy and tools.
    cloud: false
    purpose: >-
      GitHub MCP server. Needs a token; it fails to connect with
      "Authorization header is badly formatted" when the credential is
      absent or malformed, which reads like a missing server rather than
      a missing token.

  - name: ai-software-architect
    marketplace: ai-software-architect
    enabled: false
    cloud: false
    purpose: Architecture review personas. Off by default — large surface, rarely the right tool.

# Retired plugins: uninstalled, with their marketplace, on every run.
retired_plugins:
  # Deprecated upstream for Hindsight Coding Agents (coding_agents, below).
  - ref: hindsight-memory@hindsight
    marketplace: hindsight

# -------------------------------------------------------------------
# Hindsight Coding Agents: Hindsight's own plugin for Claude Code and
# Codex, pinned and locked down. One npx install wires both agents' hooks
# and a `hindsight` MCP server; the config below then turns it into recall
# only. It recalls once, at a session's first prompt, from the shared bank
# `default` (the only bank hindsight-api.* routes), and saves nothing on its
# own: no session write-back, no git seeding, no codebase survey, no
# knowledge-page refresh, no self-update from npm. Agents save deliberately,
# under the memory policy in toolGuideExtra. The token is read from
# HINDSIGHT_API_TOKEN, never written to the config.
# -------------------------------------------------------------------
coding_agents:
  package: "@vectorize-io/hindsight-coding-agents"
  version: "0.8.1"
  harnesses: [claude-code, codex]
  config:
    apiUrl: "https://hindsight-api.jorisjonkers.dev"
    bankId: default
    dynamicBankId: false
    retainSessions: false
    autoSeed: false
    codebaseSurvey: false
    gitIngest: none
    autoUpdate: false
    manageBankConfig: false
    autoInject: recall
    injectTimeoutMs: 10000
    # 20 facts by default; this keeps the first-prompt block to about 12.
    recallOptions:
      max_tokens: 1200
    pageTriggerType: manual
    # The tool guide and page roster once a session, not on every prompt.
    pageRefreshEveryTurns: 1000
    toolGuideExtra: >-
      Conversations are not captured automatically on this machine, whatever
      the guide above says: nothing is saved unless you save it. Save to
      memory only what is worth keeping long-term: decisions and
      their reasons, conventions, facts about people and the user, durable
      project context that the code and git history do not already record,
      and anything the user asks you to remember. Not small talk, not
      passing task details or progress, never secrets. Update an existing
      memory rather than adding a near-duplicate.

# Spec Kit is deliberately absent. The `speckit.*` commands and skills are
# not installed by this registry on any surface. The kit still renders its
# own Spec Kit scaffold for repositories that already depend on it; nothing
# new should adopt it.

# -------------------------------------------------------------------
# Language servers.
#
# Two halves, and missing either one looks the same from inside a session:
# the Claude Code plugin declares the LSP wiring, and the server BINARY has
# to be on PATH. A plugin whose binary is absent registers no tools and
# reports nothing.
#
# Verify with the binary, never with the plugin list:
#   command -v <binary>
# -------------------------------------------------------------------
language_servers:
  - plugin: typescript-lsp
    binary: typescript-language-server
    install: "npm install -g typescript-language-server typescript"
    languages: [typescript, javascript]
    enabled: true
    container:
      datasource: npm
      package: "typescript-language-server"
      version: "6.0.0"
      install: 'npm install -g "typescript-language-server@${VERSION}"'
      version_command: "typescript-language-server --version"
      requires: [node, typescript]
  - plugin: pyright-lsp
    binary: pyright-langserver
    install: "npm install -g pyright"
    languages: [python]
    enabled: true
    container:
      datasource: npm
      package: "pyright"
      version: "1.1.414"
      install: 'npm install -g "pyright@${VERSION}"'
      version_command: "pyright --version"
      requires: [node]
  - plugin: kotlin-lsp
    binary: kotlin-lsp
    install: "brew install kotlin-lsp"
    install_linux: >-
      v=263.4702.0 sum=1e11d2e5fefbf9ea215ad8dd6be95f2222897cd086e8cb7a661a52084a590405
      && curl -fsSL -o /tmp/kotlin-lsp.tgz "https://download-cdn.jetbrains.com/language-server/kotlin-server/${v}/kotlin-server-${v}.tar.gz"
      && echo "${sum}  /tmp/kotlin-lsp.tgz" | sha256sum -c -
      && rm -rf "${AK_OPT_DIR}/kotlin-lsp" && mkdir -p "${AK_OPT_DIR}/kotlin-lsp" "${AK_BIN_DIR}"
      && tar -xzf /tmp/kotlin-lsp.tgz -C "${AK_OPT_DIR}/kotlin-lsp" --strip-components=1 && rm -f /tmp/kotlin-lsp.tgz
      && ln -sf "${AK_OPT_DIR}/kotlin-lsp/kotlin-lsp.sh" "${AK_BIN_DIR}/kotlin-lsp"
    languages: [kotlin]
    enabled: true
  - plugin: jdtls-lsp
    binary: jdtls
    install: "brew install jdtls"
    install_linux: >-
      curl -fsSL -o /tmp/jdtls.tgz https://download.eclipse.org/jdtls/snapshots/jdt-language-server-latest.tar.gz
      && rm -rf "${AK_OPT_DIR}/jdtls" && mkdir -p "${AK_OPT_DIR}/jdtls" "${AK_BIN_DIR}"
      && tar -xzf /tmp/jdtls.tgz -C "${AK_OPT_DIR}/jdtls" && rm -f /tmp/jdtls.tgz
      && ln -sf "${AK_OPT_DIR}/jdtls/bin/jdtls" "${AK_BIN_DIR}/jdtls"
    languages: [java]
    enabled: true
  - plugin: ruby-lsp
    binary: ruby-lsp
    install: "gem install ruby-lsp"
    languages: [ruby]
    enabled: true
    cloud: false
  - plugin: gopls-lsp
    binary: gopls
    install: "go install golang.org/x/tools/gopls@latest"
    languages: [go]
    enabled: true
    cloud: false
    container:
      datasource: go
      package: "golang.org/x/tools/gopls"
      version: "v0.23.0"
      install: >-
        GOBIN=/usr/local/bin GOPATH=/tmp/gopath GOCACHE=/tmp/gocache
        go install "golang.org/x/tools/gopls@${VERSION}"
        && GOPATH=/tmp/gopath go clean -modcache && rm -rf /tmp/gopath /tmp/gocache
      version_command: "gopls version"
      requires: [go]
  - plugin: rust-analyzer-lsp
    binary: rust-analyzer
    install: "rustup component add rust-analyzer"
    # Without rustup there is no Rust work here, so a missing binary is no to-do.
    toolchain: rustup
    languages: [rust]
    enabled: true
    cloud: false
  - plugin: lua-lsp
    binary: lua-language-server
    install: "brew install lua-language-server"
    languages: [lua]
    enabled: true
    cloud: false
  - plugin: clangd-lsp
    binary: clangd
    install: "brew install llvm"
    languages: [c, cpp]
    enabled: true
    cloud: false
  - plugin: php-lsp
    binary: intelephense
    install: "npm install -g intelephense"
    languages: [php]
    enabled: true
    cloud: false
    container:
      datasource: npm
      package: "intelephense"
      version: "1.18.5"
      install: 'npm install -g "intelephense@${VERSION}"'
      # `intelephense --version` crashes instead of printing a version.
      version_command: "npm ls -g intelephense"
      requires: [node]
  - plugin: csharp-lsp
    binary: csharp-ls
    install: "dotnet tool install --global csharp-ls"
    toolchain: dotnet
    languages: [csharp]
    enabled: true
    cloud: false
  - plugin: swift-lsp
    binary: sourcekit-lsp
    # Ships inside the Xcode / Swift toolchain; there is nothing to install
    # separately, so the setup script only reports whether it is present.
    install: null
    languages: [swift]
    enabled: true
    cloud: false
  - plugin: liquid-lsp
    binary: shopify
    install: "npm install -g @shopify/cli"
    languages: [liquid]
    enabled: false
    cloud: false

# -------------------------------------------------------------------
# First-party skills that ship in this repository.
#
# Multi-file skills living under `skills/` here, copied onto a surface
# rather than fetched from an upstream. `agents:` picks the client homes.
#
# Hermes cannot take these: its sync-skills init container clones public
# git URLs with no credential, and this repository is private. A
# first-party skill reaches Hermes only by being published somewhere
# public, or by being written into the hermes-skills ConfigMap by hand.
# -------------------------------------------------------------------
local_skills:
  - name: pr-composer
    path: skills/pr-composer
    purpose: >-
      Compose a pull request in the repository's own house style: reads the
      PR template, mines recent merged PRs, and gates on an explicit
      confirmation before anything is pushed or created.
    agents: [claude, codex, vibe, antigravity]
    surfaces: [workstation]
    note: >-
      Fits the estate's label trap directly — it reads `gh label list` for
      the repo rather than guessing, which is what `gh pr create --label bug`
      gets wrong.

  - name: council
    path: skills/council
    purpose: >-
      Cross-model orchestrator (Claude + Codex) for large, decomposable work:
      triage, cross-model planning, grill, a design checkpoint, guarded
      fan-out, a review council, and resumable status/tail.
    agents: [claude, codex, vibe, antigravity]
    surfaces: [workstation]
    note: >-
      Previously shipped only by the retired install.sh. Content is unchanged from that install other than the
      retired install.sh reference in SKILL.md; council.mjs/council.toml/
      prompts/schemas mirror council/ at the repo root byte-for-byte.

  - name: kb-first
    path: skills/kb-first
    purpose: >-
      Consult the current memory platform before designing or changing
      behavior that may depend on prior captures, and capture durable
      lessons near task completion.
    agents: [claude, codex, vibe, antigravity]
    surfaces: [workstation]
    note: >-
      Rewritten for the current memory platform (memory-api/Hindsight; the
      memory-mcp/Basic Memory server it also covered is now retired). The
      original was written around the old knowledge service's recall tool,
      modes, and score thresholds (fleet-infra#231); this version deliberately does not
      invent equivalents it cannot verify, and points at each server's own
      `tools/list` instead.

  - name: token-economy
    path: skills/token-economy
    purpose: >-
      Token-budget discipline: progressive disclosure, bounded recall,
      narrow MCP profiles, and prompt-cache-friendly instruction ordering.
    agents: [claude, codex, vibe, antigravity]
    surfaces: [workstation]
    note: >-
      Rewritten alongside kb-first for the same reason: the original tuned
      env vars of the old knowledge service that do nothing against
      memory-api.

  - name: agent-session-bootstrap
    path: skills/agent-session-bootstrap
    purpose: >-
      Checklist for configuring a Claude Code or Codex session: config
      layers, MCP servers and profiles, memory-file hygiene, and Claude/Codex
      parity.
    agents: [claude, codex, vibe, antigravity]
    surfaces: [workstation]
    note: >-
      Updated to reference memory-api instead of the retired
      `knowledge` MCP server, and setup-workstation.sh's retired-hook purge
      instead of the retired install-agents.sh.

  # `topics` and `audit` are NOT ported. Both are entirely built around the
  # old knowledge service's curator/tagging admin surface -- closed-
  # vocabulary topic slugs, an unclassified-notes inbox, `rename_tag`,
  # `merge_topics` -- none of which has a memory-api
  # equivalent. Porting them would mean inventing new capability, not
  # translating existing behavior, so they are left out rather than shipped
  # against tools that do not exist. See the agent-kit#40 PR body.
  #
  # `grill-me` is also NOT here: install.sh never embeds it as static
  # content. It installs it live via `npx skills add
  # mattpocock/skills#<ref> --skill=grill-me` (see manifest.yaml's
  # provenance notes), and the workstation already gets the same family
  # (grill included) through the `mattpocock-skills` Claude Code plugin
  # above.

# -------------------------------------------------------------------
# Vendored third-party skills.
#
# `selector` semantics, as implemented by Hermes' sync-skills init
# container (fleet-infra bootstrap-configmap.yaml):
#
#   *                 every SKILL.md the source publishes
#   <category>/*      one directory level, e.g. engineering/*
#   <name>            a bare skill name matched at any depth
#   <path>/<name>     an explicit path, which is how you disambiguate a
#                     name that several directories publish
#
# Paths are relative to `<repo>/skills` when that directory exists, and to
# the repo root otherwise.
#
# Duplicate skill NAMES across one source are refused, not merged — the
# winner would otherwise depend on `find` order. Pick an explicit path when
# a repo publishes the same name more than once.
# -------------------------------------------------------------------
skill_sources:
  - name: mattpocock-skills
    repo: https://github.com/mattpocock/skills
    ref: v1.2.3
    commit: 6acc160e4e0cd062dbbbd7a1b26ae92855edf07e
    license: MIT
    license_notice: Copyright (c) 2026 Matt Pocock
    # `deprecated`, `in-progress` and `personal` are left out: two are
    # unfinished and the third is upstream's own article/vault workflows.
    selector: "engineering/*,productivity/*,misc/*"
    surfaces: [hermes]
    note: >-
      The workstation gets these through the mattpocock-skills PLUGIN
      instead, so they are not vendored twice.

  - name: superpowers
    repo: https://github.com/obra/superpowers
    ref: v6.3.0
    commit: b36e0829c6d0140e93cfef2ca599b1b07d4a7797
    license: MIT
    license_notice: Copyright (c) 2025 Jesse Vincent
    selector: "*"
    surfaces: [workstation, hermes]
    note: >-
      No plugin wraps this one on the workstation, unlike caveman,
      kubernetes-skill, drawio and mattpocock-skills. 14 skills reaching only
      Hermes was exactly the gap agent-kit#40 closed.

  - name: caveman
    repo: https://github.com/JuliusBrussee/caveman
    ref: v2.6.0
    commit: b82c0ad42c2bedc1f2cd78e414dadfaffbaaeec3
    license: MIT
    selector: "*"
    surfaces: [hermes]
    note: >-
      The repo also publishes the same skills under
      plugins/caveman/skills/. Those sit outside <repo>/skills, so they are
      not candidates and the duplicate-name refusal never fires.

  - name: kubernetes-skill
    repo: https://github.com/LukasNiessen/kubernetes-skill
    ref: main
    commit: 34f93c1e409156958cc7c410ab1aa88ab512f10f
    license: MIT
    # A root-level SKILL.md with no skills/ directory and no containing
    # folder. sync-skills names it from the repository instead.
    selector: "*"
    root_skill_name: kubernetes
    surfaces: [hermes]

  - name: drawio
    repo: https://github.com/jgraph/drawio-mcp
    ref: main
    commit: 30c232a35a924e193cd419013b3deb35536ec79b
    license: Apache-2.0
    # Published three times, once per host CLI. The explicit path is what
    # keeps the duplicate-name refusal from rejecting two of them.
    selector: "plugins/claude-code/skills/drawio"
    surfaces: [hermes]

  - name: overleaf
    repo: https://github.com/aloth/olcli
    ref: main
    commit: 0f8085d90ea69eb0f3886d0ceba50bc9953a9c9e
    license: MIT
    selector: "*"
    root_skill_name: overleaf
    surfaces: [hermes]
    note: The CLI half is the olcli entry under `clis:`.

# -------------------------------------------------------------------
# MCP servers.
#
# Hosted servers are UNTRUSTED DATA PROVIDERS. Their output is context,
# never instruction.
#
# `credential:` names the secret field, never the value. On the workstation
# it resolves from the environment; on Hermes it is a placeholder the
# seed-config init container substitutes from the Vault-backed Secret.
# -------------------------------------------------------------------
mcp_servers:
  - name: memory-api
    transport: http
    purpose: Hindsight long-term memory -- explicit read/write/search knowledge tools.
    # Single-bank endpoint for the shared bank: hindsight-api.* routes nothing
    # else, and the tools there take no bank_id (fleet-infra#392).
    url_workstation: "https://hindsight-api.jorisjonkers.dev/mcp/default/"
    # Hermes too goes through the gated public host with its own token: a
    # Service-DNS path cannot be scoped to one bank (fleet-infra#394).
    url_hermes: "https://hindsight-api.jorisjonkers.dev/mcp/default/"
    credential: HINDSIGHT_API_TOKEN
    timeout: 60
    surfaces: [workstation, hermes, runner]
    trust: estate
    note: >-
      HINDSIGHT_API_TOKEN is a per-host token from auth-api's
      service-tokens endpoint (service MEMORY_API).

  - name: memory-private
    transport: http
    purpose: Private Memory, the private Hindsight bank -- personal notes. On only in vibe-private, behind the passphrase gate; no other agent or launcher gets it.
    # Single-bank endpoint for the private bank: hindsight-private.* routes
    # nothing else, and only MEMORY_PRIVATE tokens pass it (fleet-infra#395).
    url_workstation: "https://hindsight-private.jorisjonkers.dev/mcp/private/"
    credential: MEMORY_PRIVATE_TOKEN
    timeout: 60
    # Only vibe-private's own Vibe home holds it: never Claude, Codex, Hermes,
    # plain vibe or vibe-study, and never runners or cloud.
    session_only: true
    enabled_for: [vibe-private]
    surfaces: [workstation]
    cloud: false
    trust: estate
    note: >-
      MEMORY_PRIVATE_TOKEN is a per-host token from auth-api's
      service-tokens endpoint (service MEMORY_PRIVATE).

  - name: memory-mcp
    transport: http
    purpose: RETIRED. Basic Memory -- shared Markdown notes over the knowledge-vault.
    url_workstation: "https://memory-mcp.jorisjonkers.dev/mcp"
    url_hermes: "http://basic-memory.knowledge-platform-system.svc.cluster.local:8000/mcp"
    credential: MEMORY_MCP_TOKEN
    timeout: 60
    enabled: false
    surfaces: []
    trust: estate
    note: >-
      Kept as a record, registered nowhere. Basic Memory sat idle (no note
      activity in 30 days) and is parked at zero replicas in fleet-infra;
      memory-api (Hindsight) is the agent memory, and the knowledge-vault
      repository keeps the notes. `surfaces: []` is what removes it from
      Claude, Codex, Vibe and local Hermes on the next setup run.

  - name: n8n
    transport: http
    purpose: n8n workflows through its instance-level MCP server.
    url_workstation: "https://n8n.jorisjonkers.dev/mcp-server/http"
    # Each client signs in itself; setup stores no n8n secret.
    auth: oauth
    timeout: 60
    surfaces: [workstation]
    # A cloud session has no browser to sign in with.
    cloud: false
    trust: estate

  - name: n8n-mcp
    transport: stdio
    purpose: n8n node docs and schemas, docs-only, no API key.
    command: n8n-mcp
    args: []
    timeout: 60
    surfaces: [workstation]
    trust: local
    requires_binary: n8n-mcp
    # A pinned global binary, the way Playwright is; Renovate moves the pin.
    install_pinned: true
    pin:
      datasource: npm
      package: "n8n-mcp"
      version: "2.92.1"

  - name: kubernetes
    transport: http
    purpose: Read-only cluster diagnostics through the server's own ClusterRole.
    url_hermes: "http://kubernetes-mcp-server.agents-system.svc.cluster.local:8080/mcp"
    # The workstation reaches the same read-only server via a `kubectl
    # port-forward svc/kubernetes-mcp-server 18080:8080`, because the server
    # is a ClusterIP service with no ingress route. The `url_workstation` is
    # the loopback the forward publishes on; setup starts the forward before
    # registering the server.
    url_workstation: "http://127.0.0.1:18080/mcp"
    workstation_connect:
      svc: kubernetes-mcp-server
      namespace: agents-system
      remote_port: 8080
      local_port: 18080
    # A cloud VM has no kube context to port-forward through.
    cloud: false
    timeout: 60
    surfaces: [workstation, hermes, runner]
    trust: estate

  - name: github
    transport: http
    purpose: Issues, branches, pull requests.
    url_workstation: "https://api.githubcopilot.com/mcp/"
    url_hermes: "https://api.githubcopilot.com/mcp/"
    credential: GITHUB_PAT
    timeout: 120
    surfaces: [hermes, runner]
    trust: hosted
    # The estate uses a prefixed label taxonomy (type:/area:/component:/
    # priority:/status:). Plain `bug` and `enhancement` do not exist in most
    # repos, so a label write just fails; excluding the tools stops an agent
    # inventing one.
    exclude_tools: ["*delete*", "*_label", "*_labels"]
    note: >-
      The workstation gets this through the `github` PLUGIN rather than a
      registry entry, so it is not registered twice.

  - name: vuetify
    transport: http
    purpose: Vuetify component API.
    url_workstation: "https://mcp.vuetifyjs.com/mcp"
    url_hermes: "https://mcp.vuetifyjs.com/mcp"
    timeout: 60
    enabled: false
    surfaces: [workstation, hermes]
    trust: hosted

  - name: playwright
    transport: stdio
    purpose: Browser automation.
    command: playwright-mcp
    args: ["--headless", "--browser", "chromium"]
    # The Hermes image has no global packages; see drawio.
    hermes_command: npx
    hermes_args: ["-y", "@playwright/mcp@latest", "--headless", "--browser", "chromium"]
    timeout: 120
    # A cold Chromium start can outlast Vibe's default.
    startup_timeout: 60
    surfaces: [workstation, hermes, container]
    trust: local
    requires_binary: playwright-mcp
    # The workstation installs the container pin below, so one Renovate match moves both.
    install_pinned: true
    post_install: 'node "$(npm root -g)/@playwright/mcp/node_modules/playwright/cli.js" install chromium'
    # Chromium comes from @playwright/mcp's own playwright, whose revision it matches.
    container:
      datasource: npm
      package: "@playwright/mcp"
      version: "0.0.81"
      install: >-
        npm install -g "@playwright/mcp@${VERSION}"
        && node "$(npm root -g)/@playwright/mcp/node_modules/playwright/cli.js" install --with-deps chromium
      binary: playwright-mcp
      version_command: "npm ls -g @playwright/mcp"
      requires: [node]

  - name: drawio
    transport: stdio
    purpose: Diagram authoring and export.
    command: drawio-mcp
    args: []
    # The Hermes image has node, npm, npx, uv and uvx but no globally
    # installed packages, and a `npm install -g` would not survive a pod
    # restart. Verified in-cluster: `npx --yes @aloth/olcli@latest --version`
    # prints 0.12.0 from inside the hermes container. npx caches under HOME,
    # which is on the PVC, so only the first start pays the download.
    hermes_command: npx
    hermes_args: ["-y", "@drawio/mcp@latest"]
    timeout: 60
    surfaces: [workstation, hermes, container]
    trust: local
    requires_binary: drawio-mcp
    install: "npm install -g @drawio/mcp@latest"
    container:
      datasource: npm
      package: "@drawio/mcp"
      version: "1.5.0"
      install: 'npm install -g "@drawio/mcp@${VERSION}"'
      # The binary starts a server rather than printing a version.
      version_command: "npm ls -g @drawio/mcp"
      requires: [node]

  - name: overleaf
    transport: stdio
    purpose: Self-hosted Overleaf — pull, push, compile, review comments.
    command: olcli-mcp
    args: []
    # `@aloth/olcli` ships the olcli-mcp binary; npx runs it by package.
    hermes_command: npx
    hermes_args: ["-y", "--package=@aloth/olcli@latest", "olcli-mcp"]
    timeout: 120
    surfaces: [workstation, hermes]
    trust: estate
    requires_binary: olcli-mcp
    env:
      # Self-hosted, so the base URL is mandatory. Without it olcli talks
      # to overleaf.com and every call 404s against a project that is not
      # there.
      OVERLEAF_BASE_URL: "https://overleaf.jorisjonkers.dev"
      # The self-hosted instance uses the legacy cookie name, not the
      # overleaf.com one. olcli-mcp reads this env var over its own stored
      # config, so a wrong value here breaks auth on every surface despite
      # olcli holding a valid session (verified: overleaf_session2 ->
      # "Session invalid", overleaf.sid -> "Authenticated").
      OVERLEAF_COOKIE_NAME: "overleaf.sid"
    # olcli manages its own session (stored under ~/Library/Preferences or
    # olcli-nodejs/config.json) and works WITHOUT OVERLEAF_SESSION set. It is a
    # convenience override, not a requirement -- treating it as mandatory makes
    # the setup script skip overleaf whenever the var is unset, which is wrong.
    credential: OVERLEAF_SESSION
    credential_optional: true
