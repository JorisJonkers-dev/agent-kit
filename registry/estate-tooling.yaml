# -------------------------------------------------------------------
# First-party skills that ship in this repository.
#
# Multi-file skills living under `skills/` here, copied onto a surface
# rather than fetched from an upstream. `agents:` picks the client homes.
#
# -------------------------------------------------------------------
local_skills:
  - name: pr-composer
    path: skills/workstation/pr-composer
    purpose: >-
      Compose a pull request in the repository's own house style: reads the
      PR template, mines recent merged PRs, and gates on an explicit
      confirmation before anything is pushed or created.
    agents: [claude, codex, vibe, antigravity, opencode]
    surfaces: [workstation]
    note: >-
      Fits the estate's label trap directly — it reads `gh label list` for
      the repo rather than guessing, which is what `gh pr create --label bug`
      gets wrong.

  - name: council
    path: skills/workstation/council
    purpose: >-
      Cross-model orchestrator (Claude + Codex) for large, decomposable work:
      triage, cross-model planning, grill, a design checkpoint, guarded
      fan-out, a review council, and resumable status/tail.
    agents: [claude, codex, vibe, antigravity, opencode]
    surfaces: [workstation]
    note: >-
      Previously shipped only by the retired install.sh. Content is unchanged from that install other than the
      retired install.sh reference in SKILL.md; council.mjs/council.toml/
      prompts/schemas mirror council/ at the repo root byte-for-byte.

  - name: kb-first
    path: skills/workstation/kb-first
    purpose: >-
      Consult the current memory platform before designing or changing
      behavior that may depend on prior captures, and capture durable
      lessons near task completion.
    agents: [claude, codex, vibe, antigravity, opencode]
    surfaces: [workstation]
    note: >-
      Rewritten for the current memory platform (memory-api/Hindsight; the
      memory-mcp/Basic Memory server it also covered is now retired). The
      original was written around the old knowledge service's recall tool,
      modes, and score thresholds (fleet-infra#231); this version deliberately does not
      invent equivalents it cannot verify, and points at each server's own
      `tools/list` instead.

  - name: token-economy
    path: skills/workstation/token-economy
    purpose: >-
      Token-budget discipline: progressive disclosure, bounded recall,
      narrow MCP profiles, and prompt-cache-friendly instruction ordering.
    agents: [claude, codex, vibe, antigravity, opencode]
    surfaces: [workstation]
    note: >-
      Rewritten alongside kb-first for the same reason: the original tuned
      env vars of the old knowledge service that do nothing against
      memory-api.

  - name: agent-session-bootstrap
    path: skills/workstation/agent-session-bootstrap
    purpose: >-
      Checklist for configuring a Claude Code or Codex session: config
      layers, MCP servers and profiles, memory-file hygiene, and Claude/Codex
      parity.
    agents: [claude, codex, vibe, antigravity, opencode]
    surfaces: [workstation]
    note: >-
      Updated to reference memory-api instead of the retired
      `knowledge` MCP server, and setup-workstation.sh's retired-hook purge
      instead of the retired install-agents.sh.

  - name: critique
    path: skills/workstation/critique
    purpose: >-
      The critique pipeline's shared files: the bundled runner, the prompt
      preamble, roles, lenses, finding schema and default routing that the
      critique skills drive.
    agents: [claude, codex, vibe, antigravity, opencode]
    surfaces: [workstation]
    note: >-
      critique.mjs is built from council/ts by its build and pinned in
      manifest.yaml's critique.files, the way council's runner is pinned in
      council.files.

  - name: review-grill
    path: skills/workstation/review-grill
    purpose: >-
      Critique a feature's decisions after grilling and before /to-spec:
      gap critics from other model families list the questions nobody
      asked, and the orchestrator asks the owner the real ones.
    agents: [claude, codex, vibe, antigravity, opencode]
    surfaces: [workstation]
    note: >-
      Drives the runner in skills/workstation/critique/ (prepare, fan-out, record,
      allow), so setup installs both side by side in every agent home.

  - name: review-spec
    path: skills/workstation/review-spec
    purpose: >-
      Critique a spec after /to-spec: critics from other model families
      review it read-only, and the orchestrator rules on their findings.
    agents: [claude, codex, vibe, antigravity, opencode]
    surfaces: [workstation]
    note: >-
      Drives the runner in skills/workstation/critique/ (prepare, fan-out, record,
      allow), so setup installs both side by side in every agent home.

  - name: critique-stats
    path: skills/workstation/critique-stats
    purpose: >-
      Report how each critique critic client performs per stage, from the
      ledger, ending with routing suggestions the owner acts on.
    agents: [claude, codex, vibe, antigravity, opencode]
    surfaces: [workstation]
    note: >-
      Drives the runner's stats command in skills/workstation/critique/, so setup
      installs both side by side in every agent home. It reads the ledger
      and routing and writes nothing.

  - name: review-tickets
    path: skills/workstation/review-tickets
    purpose: >-
      Check a spec's tickets after /to-tickets and before the first
      /implement: the deterministic ticket checker, then one critic from
      another model family lints their structure read-only, and the
      orchestrator fixes the tickets and asks before changing scope.
    agents: [claude, codex, vibe, antigravity, opencode]
    surfaces: [workstation]
    note: >-
      Drives the runner in skills/workstation/critique/ (prepare, fan-out, record,
      allow, check-tickets), so setup installs both side by side in every
      agent home.

  - name: review-implementation
    path: skills/workstation/review-implementation
    purpose: >-
      Review one ticket's staged change before its commit, after its
      /code-review: risk triage decides, one critic from another model
      family reviews the diff, each bug finding is decided by running its
      failing test, and the summary says "do not commit" while an accepted
      critical finding is unfixed.
    agents: [claude, codex, vibe, antigravity, opencode]
    surfaces: [workstation]
    note: >-
      Drives the runner in skills/workstation/critique/ (triage, prepare, fan-out,
      record, allow), so setup installs both side by side in every agent
      home. Its run's review.json, with the staged change's hash, is what
      the commit gate reads.

  - name: critique-adrs
    path: skills/workstation/critique-adrs
    purpose: >-
      Review a repository's decision records on the owner's word: critics
      from other model families review the ADRs read-only, the orchestrator
      rules on their findings, makes only editorial fixes, and asks the
      owner about anything that would change a decision.
    agents: [claude, codex, vibe, antigravity, opencode]
    surfaces: [workstation]
    note: >-
      Drives the runner in skills/workstation/critique/ (prepare, fan-out,
      refute, record, allow, check-adrs), so setup installs both side by
      side in every agent home. Its runs are review-stage runs, each a flow
      of its own.

  - name: review-pr
    path: skills/workstation/review-pr
    purpose: >-
      Review the whole feature diff before the pull request, after all
      tickets of a spec landed: critics from two other model families read the spec, the
      tickets and the feature diff, each accepted finding becomes a
      follow-up ticket, and the report opens with the gate line.
    agents: [claude, codex, vibe, antigravity, opencode]
    surfaces: [workstation]
    note: >-
      Drives the runner in skills/workstation/critique/ (prepare, fan-out, record,
      allow), so setup installs both side by side in every agent home. Its
      run's gate.json is what the PR gate reads.

  - name: flow
    path: skills/workstation/flow
    purpose: >-
      The critique pipeline's stepper: says in a few lines where the
      current feature stands (phase, stage runs, open questions, gate)
      and names the single next step, running a critique stage on the
      owner's word and naming the Pocock command otherwise.
    agents: [claude, codex, vibe, antigravity, opencode]
    surfaces: [workstation]
    note: >-
      Drives the runner's state command in skills/workstation/critique/ and invokes
      the stage skills, so setup installs it beside them in every agent
      home. It never runs one of Pocock's skills.

  - name: build-tracker
    path: skills/workstation/build-tracker
    purpose: >-
      The build tracker for a spec being implemented: a state file with
      each ticket's status, rendered into one page with a summary strip,
      a dependency graph and a list per milestone.
    agents: [claude, codex, vibe, antigravity, opencode]
    surfaces: [workstation]
    note: >-
      build-tracker.mjs is built from council/ts by its build and pinned
      in manifest.yaml's build_tracker.files, the way the critique runner
      is pinned in critique.files.

  - name: projects-layout
    path: skills/workstation/projects-layout
    purpose: >-
      Where clones and worktrees live on a workstation:
      ~/Projects/<owner>/<repo> and ~/Projects/<owner>/worktrees/<repo>/<name>,
      and the guard hook that denies a clone or worktree outside them.
    agents: [claude, codex, vibe, antigravity, opencode]
    surfaces: [workstation]
    note: >-
      Setup also writes the rule as a marked block into each client's global
      instruction file, and merges hooks/projects-layout-guard.sh into Claude
      Code and Codex (docs/adr/0009-projects-layout-guard.md).

  - name: estate-project-intent
    path: skills/workstation/estate-project-intent
    purpose: >-
      Write or change a Project's Intent for deploy-kit 1.x, validate it with
      deploy-kit validate, wire its publishing and propose the estate
      participants.yml entry, reading the canonical docs live with gh.
    agents: [claude, codex, vibe, antigravity, opencode]
    surfaces: [workstation]
    note: >-
      Carries the procedure and points at the canonical docs; it never copies
      them. sources.yaml records what it was checked against for
      scripts/check_skill_sources.py.

  - name: estate-delivery-status
    path: skills/workstation/estate-delivery-status
    purpose: >-
      Answer whether a release landed from the estate compose run, the commit
      status and the deployment: landed only when they agree, otherwise mixed
      with each signal and its link.
    agents: [claude, codex, vibe, antigravity, opencode]
    surfaces: [workstation]
    note: >-
      Carries the procedure and points at the canonical docs; it never copies
      them. sources.yaml records what it was checked against for
      scripts/check_skill_sources.py.

  - name: estate-rollback
    path: skills/workstation/estate-rollback
    purpose: >-
      Plan a pause, rollback or resume of one estate Project and hand the owner
      the exact gh workflow run command, reading the canonical docs and the pin
      live with gh. It never dispatches a workflow.
    agents: [claude, codex, vibe, antigravity, opencode]
    surfaces: [workstation]
    note: >-
      Carries the procedure and points at the canonical docs; it never copies
      them. sources.yaml records what it was checked against for
      scripts/check_skill_sources.py.

  - name: estate-bootstrap
    path: skills/workstation/estate-bootstrap
    purpose: >-
      Start or audit a repository against the estate templates, shared
      workflows, Renovate preset, commons libraries and testing standards,
      reporting gaps with evidence and drafting issues only after the owner
      says yes.
    agents: [claude, codex, vibe, antigravity, opencode]
    surfaces: [workstation]
    note: >-
      Carries the procedure and points at the canonical docs; it never copies
      them. sources.yaml records what it was checked against for
      scripts/check_skill_sources.py.

  - name: model-gateway
    path: skills/workstation/model-gateway
    purpose: >-
      The model gateway's runner and shipped defaults: the clients on this
      machine, the client models each offers with their family, difficulty
      tier and capability notes, and the caps and thresholds a delegation
      is held to.
    agents: [claude, codex, vibe, antigravity]
    surfaces: [workstation]
    note: >-
      model-gateway.mjs is built from council/ts by its build and pinned in
      manifest.yaml's model_gateway.files, the way the critique runner is
      pinned in critique.files. The delegate skill drives it.

  - name: delegate
    path: skills/workstation/delegate
    purpose: >-
      Plan work to hand to other model clients through the model gateway:
      rate each task's difficulty tier, split it, pick the cheapest cost
      class whose model covers the tier, send one batch and verify what
      comes back, with few Claude tokens.
    agents: [claude, codex, vibe, antigravity]
    surfaces: [workstation]
    note: >-
      Drives the gateway in skills/workstation/model-gateway/ and links to
      its SKILL.md for fields and codes. Council's triage and design skills
      point at it instead of carrying their own difficulty and model rubric.

  # `topics` and `audit` are NOT ported. Both are entirely built around the
  # old knowledge service's curator/tagging admin surface -- closed-
  # vocabulary topic slugs, an unclassified-notes inbox, `rename_tag`,
  # `merge_topics` -- none of which has a memory-api
  # equivalent. Porting them would mean inventing new capability, not
  # translating existing behavior, so they are left out rather than shipped
  # against tools that do not exist. See the agent-kit#40 PR body.
  #
  # `grill-me` is also NOT here: install.sh never embeds it as static
  # content. It installs it live via `npx skills add
  # mattpocock/skills#<ref> --skill=grill-me` (see manifest.yaml's
  # provenance notes), and the workstation already gets the same family
  # (grill included) through the `mattpocock-skills` Claude Code plugin
  # above.

# -------------------------------------------------------------------
# Read-only Vibe critic agents.
#
# One `critic-<model>` agent per Vibe critic client of the critique
# pipeline (CONTEXT.md, "Critique pipeline"). The runner launches
# `vibe --agent critic-<model>`; the agent file pins the model and carries
# its own priced `[[models]]` entry, because Vibe computes cost from
# configured prices and the entries model sync writes are priced at 0, so
# without these the price caps never fire.
#
# Rendered into registry/generated/vibe/agents/ and installed into the
# shared Vibe home's agents/ (~/.vibe/agents/, which vibe and vibe-study
# read), never into vibe-private's. The read-only settings (read_file only,
# outside_workdir deny, MCP, subagents, project context and session logging
# off) are the renderer's and the same for every agent: an entry names only
# its model and prices. `surfaces: []` retires an agent, and setup removes
# its file. Other agents in that directory are the owner's and are left
# alone.
#
# Prices are USD per million tokens, from docs.mistral.ai/inference/pricing
# (read 2026-11-01). Model names live here and in the critique routing only.
# -------------------------------------------------------------------
vibe_critic_agents:
  - name: critic-mistral-large
    model: mistral-large-4-0
    input_price: 0.7
    output_price: 2.1
    surfaces: [workstation]

  - name: critic-mistral-small
    model: mistral-small-latest
    input_price: 0.15
    output_price: 0.6
    surfaces: [workstation]

  - name: critic-glm
    model: zai-glm-5-3
    input_price: 1.4
    output_price: 4.4
    surfaces: [workstation]

  - name: critic-deepseek-flash
    model: deepseek-v4-1-flash-1017
    input_price: 0.3
    output_price: 1.2
    thinking: high
    surfaces: [workstation]

# -------------------------------------------------------------------
# Vibe delegate agents of the model gateway.
#
# The model gateway's `run` launches a read-only delegation as
# `vibe --agent delegate-readonly --model <alias>`, so the agent file
# pins no model: the alias comes from the gateway's own catalogue and
# `--model` overrides `active_model` for that one run. What the file
# fixes is the read-only part: `read_file` and `grep` and nothing else
# (no bash, no writes, no skills, no subagents, no MCP), nothing outside
# the working directory, and no project context, so the delegate sees
# the repository it was pointed at and nothing of the owner's home.
#
# A writing delegation runs as `vibe --agent delegate-write` in a
# worktree the gateway made. The same file adds `write_file` and `edit`
# (always allowed: a headless run has nobody to ask) and still has no
# shell, since the gateway runs the caller's check itself, no subagents,
# no MCP and nothing outside the worktree.
#
# Rendered into registry/generated/vibe/agents/ and installed into the
# shared Vibe home's agents/ beside the critic agents, never into
# vibe-private's. `surfaces: []` retires an agent, and setup removes its
# file.
# -------------------------------------------------------------------
vibe_delegate_agents:
  - name: delegate-readonly
    surfaces: [workstation]
  - name: delegate-write
    surfaces: [workstation]

# -------------------------------------------------------------------
# Gold Band instances (ADR-0011).
#
# Two separately configured Gold Band instances, split by employer. The
# unsuffixed name is work, `-personal` is personal. The registry holds only
# the generic shape; employer-specific entries (MCP servers, settings) live in
# the per-machine overlay ~/.config/agent-kit/overlay.yaml, beside the keep
# file, so nothing about the employer enters this public file.
#
# The gold-band-registry crate (scripts/crates/gold-band-registry) validates
# this section and the overlay on every `render_registry.py --check` and
# `--write`, and refuses:
#
#   * Codex or the work Claude agent (`claude-work`) on the personal
#     instance, from this file or from the overlay;
#   * any agent other than `claude-work` and `codex` on the work instance;
#   * an instance without its repository rule, or with the other instance's:
#     work is `remotes: nedap-only` + `no_remote: refuse`, personal is
#     `remotes: not-nedap` + `no_remote: allow`;
#   * a bank other than `nedap` on the work instance or `shared` on the
#     personal one;
#   * a literal secret in any value, an unknown field, a bad id (lowercase
#     letters and digits in dash-separated groups).
#
# The overlay (`instances:` keyed by instance id) may add `agents` (held to
# the same rules), and `mcp_servers` and `settings` to the work instance
# only. It never relaxes a rule: hosts, banks and repository rules are not
# overlay fields. This section writes no settings file; the instances are
# converged onto it by later tickets.
#
#   hosts   linux | mac. The work instance runs on the work machine (mac)
#           only.
#   banks   the work instance reaches the nedap bank only, the personal
#           instance the shared bank only (ADR-0012: employer facts never
#           enter Shared Memory); Private Memory is reachable only from vibe-private.
# -------------------------------------------------------------------
gold_band_instances:
  gold-band:
    agents: [claude-work, codex]
    repository_rule:
      remotes: nedap-only
      no_remote: refuse
    hosts: [mac]
    banks: [nedap]
  gold-band-personal:
    agents: [claude, opencode, vibe, vibe-study, pi, agy, hermes]
    repository_rule:
      remotes: not-nedap
      no_remote: allow
    hosts: [linux, mac]
    banks: [shared]

# -------------------------------------------------------------------
# Vendored third-party skills.
#
# `selector` semantics:
#
#   *                 every SKILL.md the source publishes
#   <category>/*      one directory level, e.g. engineering/*
#   <name>            a bare skill name matched at any depth
#   <path>/<name>     an explicit path, which is how you disambiguate a
#                     name that several directories publish
#
# Paths are relative to `<repo>/skills` when that directory exists, and to
# the repo root otherwise.
#
# Duplicate skill NAMES across one source are refused, not merged — the
# winner would otherwise depend on `find` order. Pick an explicit path when
# a repo publishes the same name more than once.
# -------------------------------------------------------------------
skill_sources:
  - name: mattpocock-skills
    repo: https://github.com/mattpocock/skills
    ref: v1.2.3
    commit: 6acc160e4e0cd062dbbbd7a1b26ae92855edf07e
    license: MIT
    license_notice: Copyright (c) 2026 Matt Pocock
    # `deprecated`, `in-progress` and `personal` are left out: two are
    # unfinished and the third is upstream's own article/vault workflows.
    selector: "engineering/*,productivity/*,misc/*"
    surfaces: []
    note: >-
      The workstation gets these through the mattpocock-skills PLUGIN
      instead, so they are not vendored twice.

  - name: superpowers
    repo: https://github.com/obra/superpowers
    ref: v6.3.0
    commit: b36e0829c6d0140e93cfef2ca599b1b07d4a7797
    license: MIT
    license_notice: Copyright (c) 2025 Jesse Vincent
    selector: "*"
    surfaces: [workstation]
    note: >-
      No plugin wraps this one on the workstation, unlike caveman,
      kubernetes-skill, drawio and mattpocock-skills.

  - name: caveman
    repo: https://github.com/JuliusBrussee/caveman
    ref: v2.7.0
    commit: 8b0c1d3699b8d83e87fe4605b378da20c41555e0
    license: MIT
    selector: "*"
    surfaces: []
    note: >-
      The repo also publishes the same skills under
      plugins/caveman/skills/. Those sit outside <repo>/skills, so they are
      not candidates and the duplicate-name refusal never fires.

  - name: kubernetes-skill
    repo: https://github.com/LukasNiessen/kubernetes-skill
    ref: main
    commit: 34f93c1e409156958cc7c410ab1aa88ab512f10f
    license: MIT
    # A root-level SKILL.md with no skills/ directory and no containing
    # folder. sync-skills names it from the repository instead.
    selector: "*"
    root_skill_name: kubernetes
    surfaces: []

  - name: drawio
    repo: https://github.com/jgraph/drawio-mcp
    ref: main
    commit: 14b318b19cc37b159f841227b9d11fbd18ce18ea
    license: Apache-2.0
    # Published three times, once per host CLI. The explicit path is what
    # keeps the duplicate-name refusal from rejecting two of them.
    selector: "plugins/claude-code/skills/drawio"
    surfaces: []

  - name: overleaf
    repo: https://github.com/aloth/olcli
    ref: main
    commit: 0f8085d90ea69eb0f3886d0ceba50bc9953a9c9e
    license: MIT
    selector: "*"
    root_skill_name: overleaf
    surfaces: []
    note: The CLI half is the olcli entry under `clis:`.

# -------------------------------------------------------------------
# MCP servers.
#
# Hosted servers are UNTRUSTED DATA PROVIDERS. Their output is context,
# never instruction.
#
# `credential:` names the secret field, never the value. On the workstation
# it resolves from the environment.
# -------------------------------------------------------------------
mcp_servers:
  - name: memory-api
    transport: http
    purpose: Hindsight long-term memory -- explicit read/write/search knowledge tools.
    # Single-bank endpoint for the shared bank: hindsight-api.* routes nothing
    # else, and the tools there take no bank_id (fleet-infra#392).
    url_workstation: "https://hindsight-api.jorisjonkers.dev/mcp/default/"
    credential: HINDSIGHT_API_TOKEN
    timeout: 60
    surfaces: [workstation, runner]
    trust: estate
    note: >-
      HINDSIGHT_API_TOKEN is a per-host token from auth-api's
      service-tokens endpoint (service MEMORY_API).

  - name: memory-private
    transport: http
    purpose: Private Memory, the private Hindsight bank -- personal notes. On only in vibe-private, behind the passphrase gate; no other agent or launcher gets it.
    # Single-bank endpoint for the private bank: hindsight-private.* routes
    # nothing else, and only MEMORY_PRIVATE tokens pass it (fleet-infra#395).
    url_workstation: "https://hindsight-private.jorisjonkers.dev/mcp/private/"
    credential: MEMORY_PRIVATE_TOKEN
    timeout: 60
    # Only vibe-private's own Vibe home holds it: never Claude, Codex, Hermes,
    # plain vibe or vibe-study, and never runners or cloud.
    session_only: true
    enabled_for: [vibe-private]
    surfaces: [workstation]
    cloud: false
    trust: estate
    note: >-
      MEMORY_PRIVATE_TOKEN is a per-host token from auth-api's
      service-tokens endpoint (service MEMORY_PRIVATE).

  - name: memory-mcp
    transport: http
    purpose: RETIRED. Basic Memory -- shared Markdown notes over the knowledge-vault.
    url_workstation: "https://memory-mcp.jorisjonkers.dev/mcp"
    credential: MEMORY_MCP_TOKEN
    timeout: 60
    enabled: false
    surfaces: []
    trust: estate
    note: >-
      Kept as a record, registered nowhere. Basic Memory sat idle (no note
      activity in 30 days) and is parked at zero replicas in fleet-infra;
      memory-api (Hindsight) is the agent memory, and the knowledge-vault
      repository keeps the notes. `surfaces: []` is what removes it from
      Claude, Codex, Vibe and local Hermes on the next setup run.

  - name: n8n
    transport: http
    purpose: n8n workflows through its instance-level MCP server.
    url_workstation: "https://n8n.jorisjonkers.dev/mcp-server/http"
    # Each client signs in itself; setup stores no n8n secret.
    auth: oauth
    timeout: 60
    surfaces: [workstation]
    # A cloud session has no browser to sign in with.
    cloud: false
    trust: estate

  - name: n8n-mcp
    transport: stdio
    purpose: n8n node docs and schemas, docs-only, no API key.
    command: n8n-mcp
    args: []
    timeout: 60
    surfaces: [workstation]
    trust: local
    requires_binary: n8n-mcp
    # A pinned global binary, the way Playwright is; Renovate moves the pin.
    install_pinned: true
    pin:
      datasource: npm
      package: "n8n-mcp"
      version: "2.101.0"

  - name: kubernetes
    transport: stdio
    purpose: Read-only cluster diagnostics, run locally against the workstation's read-only kube context.
    # `kubernetes-mcp-server` runs on the workstation over stdio. The command
    # is installer/kubernetes-mcp-readonly, which pins the server to the
    # current read-only kube context (`<cluster>`, never `<cluster>-admin`),
    # starts it read-only with destructive tools off and Secrets denied, and
    # hands it a throwaway single-context kubeconfig. The read-only
    # ServiceAccount (`<device>-ro`) has view without Secrets, so the cluster
    # refuses writes as well. This replaces the in-cluster server and the
    # port-forward to it (estate#316).
    command: kubernetes-mcp-readonly
    args: []
    timeout: 60
    surfaces: [workstation]
    # A cloud VM has no kube context.
    cloud: false
    trust: estate
    requires_binary: kubernetes-mcp-server
    # A pinned global binary, the way n8n-mcp is; Renovate moves the pin.
    # 0.1.x dropped the --read-only and --kubeconfig flags for TOML options,
    # which the launcher writes.
    install_pinned: true
    pin:
      datasource: npm
      package: "kubernetes-mcp-server"
      version: "0.1.1"

  - name: github
    transport: http
    purpose: Issues, branches, pull requests.
    url_workstation: "https://api.githubcopilot.com/mcp/"
    credential: GITHUB_PAT
    timeout: 120
    surfaces: [runner]
    trust: hosted
    # The estate uses a prefixed label taxonomy (type:/area:/component:/
    # priority:/status:). Plain `bug` and `enhancement` do not exist in most
    # repos, so a label write just fails; excluding the tools stops an agent
    # inventing one.
    exclude_tools: ["*delete*", "*_label", "*_labels"]
    note: >-
      The workstation gets this through the `github` PLUGIN rather than a
      registry entry, so it is not registered twice.

  - name: grimoire
    transport: http
    purpose: Grimoire, the D&D 5e table companion at grimoire.jorisjonkers.dev, through its MCP server.
    url_workstation: "https://grimoire.jorisjonkers.dev/mcp"
    credential: GRIMOIRE_API_TOKEN
    timeout: 60
    surfaces: [workstation]
    # The token lives in the workstation keychain; a cloud session has none.
    cloud: false
    trust: estate
    note: >-
      Access is limited by Grimoire, not by this entry. GRIMOIRE_API_TOKEN
      acts as the Account that minted it, held to its scopes: read for every
      read, build for changing Campaigns and their prep, play for acting in
      Sessions. A token never manages the Account or holds Admin powers, and
      a tool that takes a campaignId works only for that Campaign's DM. The
      edge must let a bearer request to /mcp through to Grimoire; while
      forward-auth answers it with the login redirect, setup refuses the
      token and the server stays unregistered.

  - name: outline
    transport: http
    purpose: Outline wiki at notes.jorisjonkers.dev through its built-in MCP server, as a separate Outline user.
    url_workstation: "https://notes.jorisjonkers.dev/mcp"
    credential: OUTLINE_API_KEY
    timeout: 60
    surfaces: [workstation]
    # The key lives in the workstation keychain; a cloud session has none.
    cloud: false
    trust: estate
    note: >-
      Access is limited by Outline, not by this entry. OUTLINE_API_KEY belongs
      to a separate Outline user, so the server sees only the collections and
      documents shared with that user. A collection every member can view is
      visible to it too. The MCP server must be on under Settings → Workspace
      → AI.

  - name: vuetify
    transport: http
    purpose: Vuetify component API.
    url_workstation: "https://mcp.vuetifyjs.com/mcp"
    timeout: 60
    enabled: false
    surfaces: [workstation]
    trust: hosted

  - name: playwright
    transport: stdio
    purpose: Browser automation.
    command: playwright-mcp
    args: ["--headless", "--browser", "chromium"]
    timeout: 120
    # A cold Chromium start can outlast Vibe's default.
    startup_timeout: 60
    surfaces: [workstation, container]
    trust: local
    requires_binary: playwright-mcp
    # The workstation installs the container pin below, so one Renovate match moves both.
    install_pinned: true
    post_install: 'node "$(npm root -g)/@playwright/mcp/node_modules/playwright/cli.js" install chromium'
    # Chromium comes from @playwright/mcp's own playwright, whose revision it matches.
    container:
      datasource: npm
      package: "@playwright/mcp"
      version: "0.0.84"
      install: >-
        npm install -g "@playwright/mcp@${VERSION}"
        && node "$(npm root -g)/@playwright/mcp/node_modules/playwright/cli.js" install --with-deps chromium
      binary: playwright-mcp
      version_command: "npm ls -g @playwright/mcp"
      requires: [node]

  - name: drawio
    transport: stdio
    purpose: Diagram authoring and export.
    command: drawio-mcp
    args: []
    timeout: 60
    surfaces: [workstation, container]
    trust: local
    requires_binary: drawio-mcp
    install: "npm install -g @drawio/mcp@latest"
    container:
      datasource: npm
      package: "@drawio/mcp"
      version: "1.10.1"
      install: 'npm install -g "@drawio/mcp@${VERSION}"'
      # The binary starts a server rather than printing a version.
      version_command: "npm ls -g @drawio/mcp"
      requires: [node]

  - name: overleaf
    transport: stdio
    purpose: Self-hosted Overleaf — pull, push, compile, review comments.
    command: olcli-mcp
    args: []
    # `@aloth/olcli` ships the olcli-mcp binary; npx runs it by package.
    timeout: 120
    surfaces: [workstation]
    trust: estate
    requires_binary: olcli-mcp
    env:
      # Self-hosted, so the base URL is mandatory. Without it olcli talks
      # to overleaf.com and every call 404s against a project that is not
      # there.
      OVERLEAF_BASE_URL: "https://overleaf.jorisjonkers.dev"
      # The self-hosted instance uses the legacy cookie name, not the
      # overleaf.com one. olcli-mcp reads this env var over its own stored
      # config, so a wrong value here breaks auth on every surface despite
      # olcli holding a valid session (verified: overleaf_session2 ->
      # "Session invalid", overleaf.sid -> "Authenticated").
      OVERLEAF_COOKIE_NAME: "overleaf.sid"
      # Since 0.15.1 olcli-mcp asks the user through MCP elicitation before
      # every write (push_file, rename, comment, accept/reject, ...), which
      # puts a dialog in front of each edit on top of the client's own tool
      # approval. "1" restores the 0.15.0 behaviour: the agent client's tool
      # approval is the only gate. Any value other than 1/true/yes keeps the
      # per-write dialog on.
      OLCLI_MCP_UNCONFIRMED_WRITES: "1"
    # Claude Code runs every overleaf tool without a prompt: setup adds
    # mcp__overleaf__* to each Claude profile's permissions.allow.
    claude_allow_tools: true
    # olcli manages its own session (stored under ~/Library/Preferences or
    # olcli-nodejs/config.json) and works WITHOUT OVERLEAF_SESSION set. It is a
    # convenience override, not a requirement -- treating it as mandatory makes
    # the setup script skip overleaf whenever the var is unset, which is wrong.
    credential: OVERLEAF_SESSION
    credential_optional: true
