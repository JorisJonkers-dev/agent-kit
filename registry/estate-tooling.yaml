  - name: openssl
    nixos: openssl
    group: core
  - name: perl
    nixos: perl
    group: core
  - name: typescript-language-server
    nixos: typescript-language-server
    group: core
  - name: pyright-langserver
    nixos: pyright
    group: core
  - name: vue-language-server
    nixos: vue-language-server
    group: core
  - name: nil
    nixos: nil
    group: core
  - name: yaml-language-server
    nixos: yaml-language-server
    group: core
  - name: bash-language-server
    nixos: bash-language-server
