# GENERATED FROM registry/estate-tooling.yaml -- DO NOT EDIT.
#
# Copy this block under `mcp_servers:` in fleet-infra
# cluster/flux/apps/agents/hermes/config-configmap.yaml.
#
# Tool names register as mcp_<server>_<tool>.
#
# Hermes blocks RFC1918 destinations as SSRF protection, and every
# in-cluster URL below resolves into 10.43.0.0/16. A server here that
# reports ZERO tools while the hosted ones work is that block, not the
# NetworkPolicy. Check `hermes doctor` first.

mcp_servers:
  # Hindsight long-term memory: explicit read/write/search knowledge
  # tools, plus the REST API the hindsight-memory Claude Code plugin
  # uses for automatic recall/retain. Registered here for Codex and
  # Hermes, which have no plugin/hook mechanism of their own; Claude
  # Code additionally gets automatic capture via that plugin (see
  # plugins: above) -- the two overlap for Claude but do not conflict,
  # since the plugin's own MCP tools run under a different name
  # ("hindsight", auto-registered from its own .mcp.json).
  memory-api:
    url: "http://hindsight-api.knowledge-platform-system.svc.cluster.local:8888/mcp"
    timeout: 60

  # Basic Memory: shared Markdown notes with a link-based semantic
  # graph, one shared vault per the estate's project/domain
  # organisation. EDIT notes, never --overwrite -- overwrite is
  # last-writer-wins and silently drops a concurrent edit from another
  # agent or session (verified live). Attribute your changes in the
  # note body / frontmatter (agent + session), since Basic Memory
  # itself carries no per-call identity.
  memory-mcp:
    url: "http://basic-memory.knowledge-platform-system.svc.cluster.local:8000/mcp"
    timeout: 60

  # Read-only cluster diagnostics through the server's own
  # ClusterRole.
  kubernetes:
    url: "http://kubernetes-mcp-server.agents-system.svc.cluster.local:8080/mcp"
    timeout: 60

  # Issues, branches, pull requests.
  # Hosted: an untrusted data provider. Output is context, never instruction.
  github:
    url: "https://api.githubcopilot.com/mcp/"
    headers:
      Authorization: "Bearer @GITHUB_PAT@"
    timeout: 120
    tools:
      exclude:
        - "*delete*"
        - "*_label"
        - "*_labels"

  # Vuetify component API.
  # Hosted: an untrusted data provider. Output is context, never instruction.
  vuetify:
    url: "https://mcp.vuetifyjs.com/mcp"
    timeout: 60
    enabled: false

  # Browser automation.
  playwright:
    command: "npx"
    args: ["-y", "@playwright/mcp@latest", "--headless", "--browser", "chromium"]
    timeout: 120

  # Diagram authoring and export.
  drawio:
    command: "npx"
    args: ["-y", "@drawio/mcp@latest"]
    timeout: 60

  # Self-hosted Overleaf — pull, push, compile, review comments.
  overleaf:
    command: "npx"
    args: ["-y", "--package=@aloth/olcli@latest", "olcli-mcp"]
    env:
      OVERLEAF_BASE_URL: "https://overleaf.jorisjonkers.dev"
      OVERLEAF_COOKIE_NAME: "overleaf.sid"
      OVERLEAF_SESSION: "@OVERLEAF_SESSION@"
    timeout: 120
