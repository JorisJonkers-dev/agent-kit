# The reach-level support record (spec #392, ADR-0013), read by the
# agent-launcher crate (docs/RUST.md).
#
# agents:  for each agent, the command that starts it and, for each reach level
#          (read, read-web, research, write-scoped, run-one-command, write,
#          full), the tool arguments that make it hold the level and one cell
#          per OS (linux, mac): verified, unverified or unsupported. A cell is
#          verified separately on each OS, with the check that proves it.
# ids:     each agent id: its agent, reach level, optional skill_set, the hosts
#          it runs on, and an output_dir for research and write-scoped. An id
#          may only name a verified cell on every host it lists.
#
# check:   for each OS, the check that proves the cell (a verified cell) or the
#          reason it is refused (an unsupported one): `<file>::<test>` for a
#          check that runs in CI, on that OS's runner. A verified cell without
#          its check is refused by `validate`.
#
# What "verified" means for claude (B1-15, #435): on that OS, the real
# launcher starts a stub claude (never the owner's ~/.claude or credentials)
# at the level, the stub receives exactly the level's tool arguments below,
# and the operating-system write limit (ADR-0013) holds for it as the table
# says. The arguments use a tool list and deny rules, never the allowed-tools
# setting alone (it only pre-approves). `run-one-command` pre-approves no Bash
# command here: the node names its one command with an extra
# `--allowedTools 'Bash(<command>)'`, and the operating system confines where
# it may write. MCP servers are never listed here (`--strict-mcp-config`): a
# node adds `--mcp-config` for the servers its level allows.
#
# Pi, OpenCode, Hermes and Antigravity (B1-17, #437): the same meaning of
# verified, with stub commands and `other_reach.rs`. A level the agent cannot
# express from launcher arguments is `unsupported`, and its check field says
# why: the launcher refuses an id that names it, and nothing is downgraded.
# Pi holds read, write-scoped, write and full (its tool allow-list); opencode
# and hermes hold full only; antigravity holds none (no tool flags documented,
# and no Linux command on main until #431 lands).
#
# What "verified" means for vibe and vibe-study (B1-16, #436) is the same, with
# Vibe's own flags: `--enabled-tools` (in headless mode it disables every
# unlisted tool), `--disabled-tools`, `--agent=accept-edits` (approves edits, not
# the shell) and `--auto-approve`. Both run the same Vibe CLI (`vibe-study` only
# supplies the Study account key), so they share arguments and checks. `vibe-acp`
# takes no tool arguments (only `--help`, `--version`, `--setup`), so the
# arguments here are for the headless CLI. An unsupported cell carries its
# reason instead of a check.
#
# The ids are added by the tickets that bind agents (Gold Band workflows).
agents:
  claude:
    command: [claude]
    levels:
      read:
        args:
          - "--permission-mode=dontAsk"
          - "--strict-mcp-config"
          - "--tools=Read,Grep,Glob"
          - "--allowedTools=Read,Grep,Glob"
          - "--disallowedTools=Bash,Edit,Write,NotebookEdit,WebFetch,WebSearch"
        support: {linux: verified, mac: verified}
        check:
          linux: "scripts/crates/agent-launcher/tests/claude_reach.rs::claude_reach_read"
          mac: "scripts/crates/agent-launcher/tests/claude_reach.rs::claude_reach_read"
      read-web:
        args:
          - "--permission-mode=dontAsk"
          - "--strict-mcp-config"
          - "--tools=Read,Grep,Glob,WebFetch,WebSearch"
          - "--allowedTools=Read,Grep,Glob,WebFetch,WebSearch"
          - "--disallowedTools=Bash,Edit,Write,NotebookEdit"
        support: {linux: verified, mac: verified}
        check:
          linux: "scripts/crates/agent-launcher/tests/claude_reach.rs::claude_reach_read_web"
          mac: "scripts/crates/agent-launcher/tests/claude_reach.rs::claude_reach_read_web"
      research:
        args:
          - "--permission-mode=dontAsk"
          - "--strict-mcp-config"
          - "--tools=Read,Grep,Glob,WebFetch,WebSearch,Write"
          - "--allowedTools=Read,Grep,Glob,WebFetch,WebSearch,Write"
          - "--disallowedTools=Bash,Edit,NotebookEdit"
        support: {linux: verified, mac: verified}
        check:
          linux: "scripts/crates/agent-launcher/tests/claude_reach.rs::claude_reach_research"
          mac: "scripts/crates/agent-launcher/tests/claude_reach.rs::claude_reach_research"
      write-scoped:
        args:
          - "--permission-mode=dontAsk"
          - "--strict-mcp-config"
          - "--tools=Read,Grep,Glob,Write,Edit"
          - "--allowedTools=Read,Grep,Glob,Write,Edit"
          - "--disallowedTools=Bash,NotebookEdit,WebFetch,WebSearch"
        support: {linux: verified, mac: verified}
        check:
          linux: "scripts/crates/agent-launcher/tests/claude_reach.rs::claude_reach_write_scoped"
          mac: "scripts/crates/agent-launcher/tests/claude_reach.rs::claude_reach_write_scoped"
      run-one-command:
        args:
          - "--permission-mode=dontAsk"
          - "--strict-mcp-config"
          - "--tools=Read,Grep,Glob,Bash"
          - "--allowedTools=Read,Grep,Glob"
          - "--disallowedTools=Edit,Write,NotebookEdit,WebFetch,WebSearch"
        support: {linux: verified, mac: verified}
        check:
          linux: "scripts/crates/agent-launcher/tests/claude_reach.rs::claude_reach_run_one_command"
          mac: "scripts/crates/agent-launcher/tests/claude_reach.rs::claude_reach_run_one_command"
      write:
        args:
          - "--permission-mode=dontAsk"
          - "--strict-mcp-config"
          - "--tools=Read,Grep,Glob,Write,Edit,NotebookEdit,Bash"
          - "--allowedTools=Read,Grep,Glob,Write,Edit,NotebookEdit,Bash"
          - "--disallowedTools=WebFetch,WebSearch"
        support: {linux: verified, mac: verified}
        check:
          linux: "scripts/crates/agent-launcher/tests/claude_reach.rs::claude_reach_write"
          mac: "scripts/crates/agent-launcher/tests/claude_reach.rs::claude_reach_write"
      full:
        args:
          - "--permission-mode=bypassPermissions"
        support: {linux: verified, mac: verified}
        check:
          linux: "scripts/crates/agent-launcher/tests/claude_reach.rs::claude_reach_full"
          mac: "scripts/crates/agent-launcher/tests/claude_reach.rs::claude_reach_full"
