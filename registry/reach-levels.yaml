      run-one-command:
        args: []
        support: {linux: unsupported, mac: unsupported}
        check:
          linux: "pi has no permission prompts or command allow-list: enabling bash lets it run any command, so a level that holds one command cannot be expressed and is refused"
          mac: "pi has no permission prompts or command allow-list: enabling bash lets it run any command, so a level that holds one command cannot be expressed and is refused"
      write:
