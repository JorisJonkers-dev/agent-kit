[project]
name = "agent-kit"
dynamic = ["version"]
requires-python = ">=3.11"
license = "LicenseRef-JorisJonkers-Proprietary-1.0"
dependencies = [
  "PyYAML==6.0.3",
  "requests==2.34.2",
  "tomlkit==0.15.2",
]

[dependency-groups]
dev = [
  "mypy==1.20.2",
  "pytest==8.4.2",
  "ruff==0.17.3",
  "types-PyYAML==6.0.12.20261103",
]

[tool.uv]
package = false
# uv resolves nothing published in the last 7 days. The relative value rolls forward
# on every `uv lock`; the lock records it as exclude-newer-span = "P7D".
exclude-newer = "7 days"
# 0.9.17 is the oldest uv that applies the window; older uv ignores exclude-newer
# silently, and this key makes every run refuse a uv below the floor.
required-version = ">=0.9.17"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 120
target-version = "py311"
# skills/ holds vendored first-party skill bundles that are copied onto a
# surface verbatim. Reformatting them to this repo's lint rules would make the
# vendored copy differ from the source of truth for no benefit.
# handoff-gold-band/ holds the Gold Band epic's throwaway handoff tooling and
# its recorded data, which no gate runs; it is not production code.
extend-exclude = ["skills", "handoff-gold-band"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"scripts/validate_manifest.py" = ["UP022"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["scripts"]

