[project]
name = "agent-kit"
dynamic = ["version"]
requires-python = "==3.14.7"
license = "LicenseRef-JorisJonkers-Proprietary-1.0"
dependencies = [
  "PyYAML==6.0.3",
  "requests==2.34.2",
]

[dependency-groups]
dev = [
  "mypy==1.20.2",
  "pytest==8.4.2",
  "ruff==0.15.20",
  "types-PyYAML==6.0.12.20260518",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 120
target-version = "py311"
# skills/ holds vendored first-party skill bundles that are copied onto a
# surface verbatim. Reformatting them to this repo's lint rules would make the
# vendored copy differ from the source of truth for no benefit.
extend-exclude = ["skills"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"scripts/validate_manifest.py" = ["UP022"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["render-agent-kit.py", "scripts"]

