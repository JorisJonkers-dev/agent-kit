'name': 'Add to Project'

'on':
  'issues':
    'types':
      - 'opened'
      - 'reopened'
      - 'transferred'
  'pull_request_target':
    'types':
      - 'opened'
      - 'reopened'
      - 'ready_for_review'

'permissions':
  'contents': 'read'

'jobs':
  'add-to-project':
    'uses': 'JorisJonkers-dev/github-workflows/.github/workflows/add-to-project.yml@8aaf024208bf4b29acb468aecd3cd7ee130d5ac1' # v0.49.1
    'with':
      'project-url': 'https://github.com/orgs/JorisJonkers-dev/projects/2'
    'secrets':
      'PROJECT_AUTOMATION_APP_ID': '${{ secrets.RELEASE_APP_ID }}'
      'PROJECT_AUTOMATION_APP_PRIVATE_KEY': '${{ secrets.RELEASE_APP_PRIVATE_KEY }}'
      'PACKAGES_PROXY_TOKEN': '${{ secrets.PACKAGES_PROXY_TOKEN }}'
