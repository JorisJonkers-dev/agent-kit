'name': 'CI'

'on':
  'pull_request':
  'push':
    'branches':
      - 'main'
  'workflow_dispatch':

'concurrency':
  'group': 'ci-${{ github.workflow }}-${{ github.ref }}'
  'cancel-in-progress': '${{ github.ref != ''refs/heads/main'' }}'

'permissions':
  'contents': 'read'

'jobs':
  # The Python checks are three jobs: lint, type check and the wall-time tests
  # in one; the rest of the tests split across a matrix of shards, each on
  # every core of its runner with pytest-xdist; and the aggregate below, which
  # carries the check name earlier runs reported. A setup-script test runs the
  # whole installer in a temp HOME, so the suite is CPU-bound; the repository
  # is public, so the extra runners are not billed. tests/ci_shard.py does the
  # split: together the shards run every test exactly once.
  'python-lint':
    'name': 'Python Lint / Typecheck / Timing Tests'
    'runs-on': 'ubuntu-latest'
    'steps':
      - 'uses': 'actions/checkout@v6'
      - 'uses': 'JorisJonkers-dev/github-workflows/actions/setup-package-proxy@48fcba8b143567e12716f4b77b9a3ab211719ffd' # v0.50.1
        'with':
          'token': '${{ secrets.PACKAGES_PROXY_TOKEN }}'
          'require-package-proxy': 'true'
      - 'uses': 'astral-sh/setup-uv@v8.2.0'
      - 'run': 'uv sync --frozen'
      - 'run': 'uv run ruff check .'
      - 'run': 'uv run mypy'
        'if': '${{ !cancelled() }}'
      # A test that asserts wall time runs here, on an otherwise idle runner;
      # the shards leave it out.
      - 'run': 'uv run pytest -m timing'
        'if': '${{ !cancelled() }}'

  'python-tests':
    'name': 'Python Tests (${{ matrix.shard }}/${{ strategy.job-total }})'
    'strategy':
      'fail-fast': false
      'matrix':
        'shard': [1, 2, 3]
    'runs-on': 'ubuntu-latest'
    # A shard takes about three minutes; a hung test fails it instead of
    # holding the merge for the six-hour default.
    'timeout-minutes': 20
    # A few tests build the ci-helpers binary (cargo resolves through the
    # authenticated packages proxy, as in the Rust jobs).
    'env':
      'CARGO_REGISTRIES_JORISJONKERS_PACKAGES_INDEX': 'sparse+https://packages.jorisjonkers.dev/cargo/'
      'CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS': 'cargo:token'
    'steps':
      - 'uses': 'actions/checkout@v6'
      - 'uses': 'JorisJonkers-dev/github-workflows/actions/setup-package-proxy@48fcba8b143567e12716f4b77b9a3ab211719ffd' # v0.50.1
        'with':
          'token': '${{ secrets.PACKAGES_PROXY_TOKEN }}'
          'require-package-proxy': 'true'
      - 'uses': 'astral-sh/setup-uv@v8.2.0'
      - 'run': 'uv sync --frozen'
      # faulthandler_timeout prints every thread's stack when one test runs
      # past five minutes, so a hang names the test that hung.
      - 'run': 'uv run pytest -n auto -m "not timing" --durations=20 -o faulthandler_timeout=300'
        'env':
          'PYTEST_SHARD': '${{ matrix.shard }}/${{ strategy.job-total }}'

  # The check name every earlier run reported. It passes only when lint, type
  # check and every test shard passed: a failed, cancelled or skipped shard
  # fails it.
  'python':
    'name': 'Python Lint / Typecheck / Tests'
    'if': 'always()'
    'needs':
      - 'python-lint'
      - 'python-tests'
    'runs-on': 'ubuntu-latest'
    'steps':
      - 'uses': 're-actors/alls-green@release/v1'
        'with':
          'jobs': '${{ toJSON(needs) }}'

  'runtime-package':
    'name': 'Runtime Package Contract'
    'runs-on': 'ubuntu-latest'
    'steps':
      - 'uses': 'actions/checkout@v6'
      - 'uses': 'JorisJonkers-dev/github-workflows/actions/setup-package-proxy@48fcba8b143567e12716f4b77b9a3ab211719ffd' # v0.50.1
        'with':
          'token': '${{ secrets.PACKAGES_PROXY_TOKEN }}'
          'require-package-proxy': 'true'
      - 'uses': 'astral-sh/setup-uv@v8.2.0'
      - 'run': 'uv sync --frozen'
      - 'run': 'uv run python scripts/render_agent_kit.py --check'
      - 'run': 'uv run python scripts/render_agent_kit.py --doctor'
      # The registry is the single source for the workstation setup script and
      # the per-agent MCP configs. This fails on a hand edit to a
      # generated artifact and on a registry change that was never rendered.
      # `!cancelled()` so one failure still surfaces the rest: a job is billed
      # by the minute rounded up, so these belong as steps here rather than in
      # a job of their own.
      - 'run': 'uv run python scripts/render_registry.py --check'
        'if': '${{ !cancelled() }}'
      - 'run': 'bash -n installer/setup-workstation.sh'
        'if': '${{ !cancelled() }}'
      - 'run': 'bash -n installer/setup-container.sh'
        'if': '${{ !cancelled() }}'
      - 'run': 'bash -n installer/kubernetes-mcp-readonly'
        'if': '${{ !cancelled() }}'
      - 'run': 'scripts/build-runtime-package.sh v0.0.0-ci dist'
      - 'run': 'tar -tzf dist/agent-kit-runtime-home-v0.0.0-ci.tar.gz >/dev/null'

  # The actionlint job. It was named `workflow-lint` / 'Workflow Lint' like the
  # Gold Band `workflow-lint` crate (next job), so the two read as one. Neither
  # name is a required check (the ruleset requires only 'Pipeline Complete' and
  # the attribution guard), and 'Pipeline Complete' needs this job by key.
  'actionlint':
    'name': 'Actionlint (GitHub workflow YAML)'
    'runs-on': 'ubuntu-latest'
    'steps':
      - 'uses': 'actions/checkout@v6'
      - 'id': 'actionlint'
        'shell': 'bash'
        'run': 'bash <(curl --fail --silent --show-error --location https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)'
      - 'run': '"${{ steps.actionlint.outputs.executable }}" -color .github/workflows/*.yml'

  # The editor's shape rules over every shipped Gold Band template (#780),
  # with the known-failures list of #781: a listed template is tolerated, any
  # other failure, and a listed template that now passes, fails the job.
  # docs/GOLD-BAND.md "How workflows are validated".
  'gold-band-workflow-shape':
    'name': 'Gold Band Workflow Shape'
    'runs-on': 'ubuntu-latest'
    'steps':
      - 'uses': 'actions/checkout@v6'
      - 'uses': 'JorisJonkers-dev/github-workflows/actions/setup-package-proxy@48fcba8b143567e12716f4b77b9a3ab211719ffd' # v0.50.1
        'with':
          'token': '${{ secrets.PACKAGES_PROXY_TOKEN }}'
          'require-package-proxy': 'true'
      - 'name': 'Build workflow-lint'
        'working-directory': '${{ runner.temp }}'
        'env':
          'CARGO_TARGET_DIR': '${{ runner.temp }}/shape-target'
          'CARGO_REGISTRIES_JORISJONKERS_PACKAGES_INDEX': 'sparse+https://packages.jorisjonkers.dev/cargo/'
          'CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS': 'cargo:token'
        'run': 'cargo build --locked --manifest-path "$GITHUB_WORKSPACE/scripts/Cargo.toml" -p workflow-lint'
      - 'name': 'Lint every template against the editor shape rules'
        'run': 'scripts/check-workflow-shape.sh "$RUNNER_TEMP/shape-target/debug/workflow-lint"'
      # Setup applies the same rules through scripts/gold_band_shape.py; this
      # fails when the Python twin and the crate disagree.
      - 'uses': 'astral-sh/setup-uv@v8.2.0'
      - 'run': 'uv sync --frozen'
      - 'run': 'uv run pytest tests/test_gold_band_shape.py'
        'env':
          'WORKFLOW_LINT_BIN': '${{ runner.temp }}/shape-target/debug/workflow-lint'

  # No new or changed Python or TypeScript outside the shrink-only allowlist
  # (#804, parent #802: the repository is going 100% Rust). The guard reads
  # the pull request's base and body from the event payload; a push to main
  # has no pull request and passes. docs/RUST.md "Rust migration guard".
  'rust-migration-guard':
    'name': 'Rust Migration Guard'
    'runs-on': 'ubuntu-latest'
    'steps':
      - 'uses': 'actions/checkout@v6'
        'with':
          'fetch-depth': 0
      - 'uses': 'JorisJonkers-dev/github-workflows/actions/setup-package-proxy@48fcba8b143567e12716f4b77b9a3ab211719ffd' # v0.50.1
        'with':
          'token': '${{ secrets.PACKAGES_PROXY_TOKEN }}'
          'require-package-proxy': 'true'
      - 'name': 'Build rust-migration-guard'
        'working-directory': '${{ runner.temp }}'
        'env':
          'CARGO_TARGET_DIR': '${{ runner.temp }}/guard-target'
          'CARGO_REGISTRIES_JORISJONKERS_PACKAGES_INDEX': 'sparse+https://packages.jorisjonkers.dev/cargo/'
          'CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS': 'cargo:token'
        'run': 'cargo build --locked --manifest-path "$GITHUB_WORKSPACE/scripts/Cargo.toml" -p rust-migration-guard'
      - 'name': 'No new or changed Python or TypeScript outside the allowlist'
        'run': '"$RUNNER_TEMP/guard-target/debug/rust-migration-guard" --event-path "$GITHUB_EVENT_PATH"'

  'shell-lint':
    'name': 'Shell Lint'
    'runs-on': 'ubuntu-latest'
    'steps':
      - 'uses': 'actions/checkout@v6'

      - 'name': 'Install shellcheck'
        'run': 'sudo apt-get update && sudo apt-get install -y shellcheck'

      - 'name': 'Lint repo-owned shell scripts'
        'shell': 'bash'
        'run': |
          set -euo pipefail
          shopt -s nullglob
          repo_shell_scripts=(scripts/*.sh)
          if [ -f build-runtime-package.sh ]; then
            repo_shell_scripts+=(build-runtime-package.sh)
          fi
          if [ "${#repo_shell_scripts[@]}" -eq 0 ]; then
            echo "No repo-owned shell scripts found" >&2
            exit 1
          fi
          bash -n "${repo_shell_scripts[@]}"
          shellcheck "${repo_shell_scripts[@]}"

      - 'name': 'Test the bootstrap shell'
        'if': '${{ !cancelled() }}'
        'run': 'scripts/test-bootstrap.sh'

      - 'name': 'Lint the generated container setup script'
        'if': '${{ !cancelled() }}'
        'run': 'shellcheck installer/setup-container.sh'

      - 'name': 'Lint the cloud environment scripts'
        'if': '${{ !cancelled() }}'
        'run': 'shellcheck installer/cloud/setup-script.sh installer/cloud-session.sh'

  # The Gold Band headless proof (issue #447): the spec-stage template, and any
  # workflow beside it in installer/gold-band/workflows/, runs headless against
  # the stub agent on Linux and macOS. The Gold Band binary is supplied per OS
  # through repository variables (a URL and its SHA-256, so the build is
  # pinned); without one the job prints why and proves nothing, and a real run
  # of the workflow stays refused. docs/gold-band-proof.md.
  'gold-band-proof':
    'name': 'Gold Band Headless Proof'
    'strategy':
      'fail-fast': false
      'matrix':
        'include':
          - 'os': 'ubuntu-latest'
            'platform': 'linux'
            'suffix': 'LINUX'
            'url': '${{ vars.GOLD_BAND_BIN_URL_LINUX }}'
            'sha256': '${{ vars.GOLD_BAND_BIN_SHA256_LINUX }}'
          - 'os': 'macos-latest'
            'platform': 'macos'
            'suffix': 'MACOS'
            'url': '${{ vars.GOLD_BAND_BIN_URL_MACOS }}'
            'sha256': '${{ vars.GOLD_BAND_BIN_SHA256_MACOS }}'
    'runs-on': '${{ matrix.os }}'
    'env':
      'GOLD_BAND_COMMIT': '${{ vars.GOLD_BAND_COMMIT }}'
    'steps':
      - 'uses': 'actions/checkout@v6'
      - 'uses': 'JorisJonkers-dev/github-workflows/actions/setup-package-proxy@48fcba8b143567e12716f4b77b9a3ab211719ffd' # v0.50.1
        'with':
          'token': '${{ secrets.PACKAGES_PROXY_TOKEN }}'
          'require-package-proxy': 'true'
      # The build runs from the runner's temp directory and resolves through
      # the packages proxy that setup-package-proxy configured.
      - 'name': 'Build the harness'
        'working-directory': '${{ runner.temp }}'
        'env':
          'CARGO_TARGET_DIR': '${{ runner.temp }}/proof-target'
          'CARGO_REGISTRIES_JORISJONKERS_PACKAGES_INDEX': 'sparse+https://packages.jorisjonkers.dev/cargo/'
          'CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS': 'cargo:token'
        'run': 'cargo build --locked --manifest-path "$GITHUB_WORKSPACE/scripts/Cargo.toml" -p gold-band-proof'
      - 'name': 'Fetch the supplied Gold Band binary'
        'env':
          'GOLD_BAND_URL': '${{ matrix.url }}'
          'GOLD_BAND_SHA256': '${{ matrix.sha256 }}'
        'run': |
          set -euo pipefail
          if [ -z "$GOLD_BAND_URL" ]; then
            echo "gold band: no binary supplied for ${{ matrix.platform }} (repository variable GOLD_BAND_BIN_URL_${{ matrix.suffix }} is empty); the headless proof is skipped"
            exit 0
          fi
          if [ -z "$GOLD_BAND_SHA256" ]; then
            echo "::error::a Gold Band binary URL is supplied for ${{ matrix.platform }} without its SHA-256"
            exit 1
          fi
          curl --fail --silent --show-error --location "$GOLD_BAND_URL" --output "$RUNNER_TEMP/gold-band"
          echo "$GOLD_BAND_SHA256  $RUNNER_TEMP/gold-band" | shasum -a 256 -c -
          chmod +x "$RUNNER_TEMP/gold-band"
          echo "GOLD_BAND_BIN=$RUNNER_TEMP/gold-band" >> "$GITHUB_ENV"
      - 'name': 'Prove every checked-in workflow headless'
        'run': |
          set -euo pipefail
          proof="$RUNNER_TEMP/proof-target/debug/gold-band-proof"
          commit_args=()
          [ -z "$GOLD_BAND_COMMIT" ] || commit_args=(--gold-band-commit "$GOLD_BAND_COMMIT")
          for workflow in installer/gold-band/workflows/*.json; do
            "$proof" prove --workflow "$workflow" --record-dir "$RUNNER_TEMP/proofs" ${commit_args[@]+"${commit_args[@]}"}
          done
      # A real run needs a recorded, passing proof: with the binary the check
      # passes, without it the skipped proof must refuse (exit 5).
      - 'name': 'A real run is allowed only after a passing proof'
        'run': |
          set -uo pipefail
          proof="$RUNNER_TEMP/proof-target/debug/gold-band-proof"
          expected=5
          [ -z "${GOLD_BAND_BIN:-}" ] || expected=0
          for workflow in installer/gold-band/workflows/*.json; do
            "$proof" check --workflow "$workflow" --record-dir "$RUNNER_TEMP/proofs" --build-record "$RUNNER_TEMP/none.json" && code=0 || code=$?
            if [ "$code" -ne "$expected" ]; then
              echo "::error::check of $workflow exited $code, expected $expected"
              exit 1
            fi
          done

  # The macOS write limit (ADR-0013, issue #434) can only be proven on macOS:
  # the launcher's enforcement tests start a stub agent under the real
  # sandbox-exec. Built from the runner's temp directory through the packages
  # proxy, like the headless proof above.
  'rust-macos':
    'name': 'Rust Tests (macos)'
    'runs-on': 'macos-latest'
    'steps':
      - 'uses': 'actions/checkout@v6'
      - 'uses': 'JorisJonkers-dev/github-workflows/actions/setup-package-proxy@48fcba8b143567e12716f4b77b9a3ab211719ffd' # v0.50.1
        'with':
          'token': '${{ secrets.PACKAGES_PROXY_TOKEN }}'
          'require-package-proxy': 'true'
      - 'name': 'Test the launcher and the code-nav read-reach proof on macOS'
        'working-directory': '${{ runner.temp }}'
        'env':
          'CARGO_TARGET_DIR': '${{ runner.temp }}/rust-target'
          'CARGO_REGISTRIES_JORISJONKERS_PACKAGES_INDEX': 'sparse+https://packages.jorisjonkers.dev/cargo/'
          'CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS': 'cargo:token'
        'run': 'cargo test --locked --manifest-path "$GITHUB_WORKSPACE/scripts/Cargo.toml" -p agent-launcher && cargo test --locked --manifest-path "$GITHUB_WORKSPACE/scripts/Cargo.toml" -p code-nav --test read_reach'

  # Holds a marketplace pin bump that adds code to run. Not in Pipeline
  # Complete, so it stops Renovate's automerge but not a reviewed manual merge.
  'marketplace-pins':
    'name': 'Marketplace Pin Review'
    'if': "github.event_name == 'pull_request'"
    'runs-on': 'ubuntu-latest'
    'env':
      'BASE_SHA': '${{ github.event.pull_request.base.sha }}'
    'steps':
      - 'uses': 'actions/checkout@v6'
      - 'uses': 'JorisJonkers-dev/github-workflows/actions/setup-package-proxy@48fcba8b143567e12716f4b77b9a3ab211719ffd' # v0.50.1
        'with':
          'token': '${{ secrets.PACKAGES_PROXY_TOKEN }}'
          'require-package-proxy': 'true'
      - 'run': 'git fetch --quiet --depth 1 origin "${BASE_SHA}"'
      - 'name': 'Review the marketplace pin bump'
        'env':
          'CARGO_REGISTRIES_JORISJONKERS_PACKAGES_INDEX': 'sparse+https://packages.jorisjonkers.dev/cargo/'
          'CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS': 'cargo:token'
        'run': 'cargo run --locked --manifest-path scripts/Cargo.toml -p ci-helpers -- marketplace-bump --base-ref "${BASE_SHA}"'

  # The registry's NixOS package list names nixpkgs attributes by path. This
  # fails when one of them is not in the nixpkgs revision nixos-modules pins,
  # or is there but does not evaluate, so an upstream rename of a nixpkgs
  # package is caught here rather than on a machine. Entries packaged by
  # nixos-modules itself are checked by that flake's workstation example.
  'nixos-packages':
    'name': 'NixOS Package List'
    'runs-on': 'ubuntu-latest'
    'steps':
      - 'uses': 'actions/checkout@v6'
      - 'uses': 'cachix/install-nix-action@v31'
      # The list is generated by render_registry.py and must exist; a branch
      # that deletes it fails here instead of passing with nothing checked.
      - 'name': 'Require the generated list'
        'run': 'test -f registry/generated/nixos/packages.nix || { echo "::error::registry/generated/nixos/packages.nix is missing; run scripts/render_registry.py --write"; exit 1; }'
      # The list is only meaningful against the nixpkgs nixos-modules builds
      # its packages from, so the revision comes from that flake's lock file.
      - 'name': 'Read the nixpkgs revision nixos-modules pins'
        'run': |
          set -euo pipefail
          rev="$(curl -fsSL https://raw.githubusercontent.com/JorisJonkers-dev/nixos-modules/main/flake.lock \
            | jq -r '.nodes.nixpkgs.locked.rev')"
          if ! printf '%s' "${rev}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::nixos-modules' flake.lock names no valid nixpkgs revision: ${rev}"
            exit 1
          fi
          echo "NIXPKGS_REV=${rev}" >> "$GITHUB_ENV"
      - 'name': 'Check every nixpkgs attribute resolves and evaluates'
        'run': |
          set -euo pipefail
          nix --extra-experimental-features 'nix-command flakes' eval --json --impure \
            --expr "import ./scripts/check-nixos-packages.nix { nixpkgs = builtins.fetchTarball \"https://github.com/NixOS/nixpkgs/archive/${NIXPKGS_REV}.tar.gz\"; }" \
            > nixos-packages.json
          jq -r '.failures[]' nixos-packages.json | while read -r failure; do
            echo "::error::${failure}"
          done
          if [ "$(jq -r '.ok' nixos-packages.json)" != "true" ]; then
            echo "::error::$(jq -r '.failures | length' nixos-packages.json) of $(jq -r '.checked' nixos-packages.json) nixpkgs attributes failed"
            exit 1
          fi
          echo "All $(jq -r '.checked' nixos-packages.json) nixpkgs attributes resolve and evaluate."

  # The Rust workspace: build, tests, the port inventory, the reach-level
  # record and the 100 percent line-coverage gate (docs/RUST.md). Cargo resolves
  # through the packages proxy, whose registry is authenticated: setup-package-proxy
  # writes the source replacement and exports the token; cargo also needs the
  # registry declared by name and told to read tokens from the environment.
  'rust-workspace':
    'name': 'Rust Workspace'
    'runs-on': 'ubuntu-latest'
    'env':
      'CARGO_REGISTRIES_JORISJONKERS_PACKAGES_INDEX': 'sparse+https://packages.jorisjonkers.dev/cargo/'
      'CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS': 'cargo:token'
    'steps':
      - 'uses': 'actions/checkout@v6'
      - 'uses': 'JorisJonkers-dev/github-workflows/actions/setup-package-proxy@48fcba8b143567e12716f4b77b9a3ab211719ffd' # v0.50.1
        'with':
          'token': '${{ secrets.PACKAGES_PROXY_TOKEN }}'
          'require-package-proxy': 'true'
      - 'name': 'Current stable Rust'
        'run': |
          rustup update stable --no-self-update
          rustup default stable
      - 'name': 'Build the workspace'
        'run': 'cargo build --locked --manifest-path scripts/Cargo.toml'
      - 'name': 'Test the workspace'
        'run': 'cargo test --locked --manifest-path scripts/Cargo.toml'
      # Every skill, hook, role file and MCP server has exactly one target
      # and its lanes in docs/gold-band-port-inventory.md (spec #392).
      - 'name': 'Check the Gold Band port inventory'
        'run': 'cargo run --locked --manifest-path scripts/Cargo.toml -p inventory-check -- .'
      # The reach-level support record: every id names a level, its agent
      # can hold it on each OS it runs on, and research and write-scoped ids
      # carry an output directory (docs/REGISTRY.md).
      - 'name': 'Validate the reach-level support record'
        'run': 'cargo run --locked --manifest-path scripts/Cargo.toml -p agent-launcher -- validate registry/reach-levels.yaml'
      # Every estate skill's sources.yaml is well formed, and every AGENTS.md
      # names only paths and symbols that exist (docs/RUST.md, "ci-helpers").
      - 'name': 'Validate the estate skill sources'
        'run': 'cargo run --locked --manifest-path scripts/Cargo.toml -p ci-helpers -- skill-sources --validate'
      - 'name': 'AGENTS.md names only things that exist'
        'run': 'cargo run --locked --manifest-path scripts/Cargo.toml -p ci-helpers -- agents-md'
      # No delegation profile or critique roster names a model the catalogue
      # snapshot calls blocked or failed (docs/RUST.md, "critique").
      - 'name': 'Profiles and routing name only models the catalogue can run'
        'run': 'cargo run --locked --manifest-path scripts/Cargo.toml -p critique -- check-routing --json ''{"catalogue":"registry/litellm-catalogue.json"}'''
      # Line coverage of the workspace must stay at 100 percent (docs/RUST.md).
      # rustc's own instrumentation plus the llvm-tools component of the same
      # toolchain, so no further crate is involved and the profile format
      # always matches. src/main.rs exit wrappers are excluded.
      - 'name': 'Rust line coverage is 100 percent'
        'run': |
          rustup component add llvm-tools
          scripts/coverage.sh

  'pipeline-complete':
    'name': 'Pipeline Complete'
    'if': 'always()'
    'needs':
      - 'nixos-packages'
      - 'python'
      - 'python-lint'
      - 'python-tests'
      - 'runtime-package'
      - 'shell-lint'
      - 'actionlint'
      - 'gold-band-workflow-shape'
      - 'rust-migration-guard'
      - 'gold-band-proof'
      - 'rust-macos'
      - 'rust-workspace'
    'runs-on': 'ubuntu-latest'
    'steps':
      - 'uses': 're-actors/alls-green@release/v1'
        'with':
          'jobs': '${{ toJSON(needs) }}'
