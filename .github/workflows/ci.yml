'name': 'CI'

'on':
  'pull_request':
  'push':
    'branches':
      - 'main'
  'workflow_dispatch':

'concurrency':
  'group': 'ci-${{ github.workflow }}-${{ github.ref }}'
  'cancel-in-progress': '${{ github.ref != ''refs/heads/main'' }}'

'permissions':
  'contents': 'read'

'jobs':
  'python':
    'name': 'Python Lint / Typecheck / Tests'
    'runs-on': 'ubuntu-latest'
    'steps':
      - 'uses': 'actions/checkout@v6'
      - 'uses': 'JorisJonkers-dev/github-workflows/actions/setup-package-proxy@8aaf024208bf4b29acb468aecd3cd7ee130d5ac1' # v0.49.1
        'with':
          'token': '${{ secrets.PACKAGES_PROXY_TOKEN }}'
          'require-package-proxy': 'true'
      - 'uses': 'astral-sh/setup-uv@v8.2.0'
      - 'run': 'uv sync --frozen'
      - 'run': 'uv run ruff check .'
      - 'run': 'uv run mypy'
      - 'run': 'uv run pytest'
      - 'run': 'uv run python scripts/check_skill_sources.py --validate'
      - 'run': 'uv run python scripts/check_agents_md.py'

  'runtime-package':
    'name': 'Runtime Package Contract'
    'runs-on': 'ubuntu-latest'
    'steps':
      - 'uses': 'actions/checkout@v6'
      - 'uses': 'JorisJonkers-dev/github-workflows/actions/setup-package-proxy@8aaf024208bf4b29acb468aecd3cd7ee130d5ac1' # v0.49.1
        'with':
          'token': '${{ secrets.PACKAGES_PROXY_TOKEN }}'
          'require-package-proxy': 'true'
      - 'uses': 'pnpm/action-setup@v4'
        'with':
          'package_json_file': 'council/ts/package.json'
      - 'uses': 'astral-sh/setup-uv@v8.2.0'
      - 'run': 'uv sync --frozen'
      - 'run': 'uv run python scripts/render_agent_kit.py --check'
      - 'run': 'uv run python scripts/render_agent_kit.py --doctor'
      # The registry is the single source for the workstation setup script and
      # the per-agent MCP configs. This fails on a hand edit to a
      # generated artifact and on a registry change that was never rendered.
      # `!cancelled()` so one failure still surfaces the rest: a job is billed
      # by the minute rounded up, so these belong as steps here rather than in
      # a job of their own.
      - 'run': 'uv run python scripts/render_registry.py --check'
        'if': '${{ !cancelled() }}'
      - 'run': 'bash -n installer/setup-workstation.sh'
        'if': '${{ !cancelled() }}'
      - 'run': 'bash -n installer/setup-container.sh'
        'if': '${{ !cancelled() }}'
      - 'run': 'bash -n installer/kubernetes-mcp-readonly'
        'if': '${{ !cancelled() }}'
      - 'run': 'scripts/build-runtime-package.sh v0.0.0-ci dist'
      - 'run': 'tar -tzf dist/agent-kit-runtime-home-v0.0.0-ci.tar.gz >/dev/null'

  'node':
    'name': 'Node CI'
    'runs-on': 'ubuntu-latest'
    'steps':
      - 'uses': 'actions/checkout@v6'
      - 'uses': 'JorisJonkers-dev/github-workflows/actions/setup-package-proxy@8aaf024208bf4b29acb468aecd3cd7ee130d5ac1' # v0.49.1
        'with':
          'token': '${{ secrets.PACKAGES_PROXY_TOKEN }}'
          'require-package-proxy': 'true'
      - 'uses': 'pnpm/action-setup@v4'
        'with':
          'package_json_file': 'council/ts/package.json'
      - 'uses': 'actions/setup-node@v6'
        'with':
          'node-version': '22'
          'cache': 'pnpm'
          'cache-dependency-path': 'council/ts/pnpm-lock.yaml'
      # The build tracker's online checks: the pinned Mermaid hash against
      # the CDN file, and the graph rendered from a local file in headless
      # Chrome. Opt-in on a workstation. The ubuntu runner image ships
      # google-chrome on PATH; BUILD_TRACKER_REQUIRE_CHROME makes the browser
      # tests fail rather than skip if it ever stops shipping one.
      - 'run': 'cd council/ts && pnpm install --frozen-lockfile && pnpm run build && pnpm test'
        'env':
          'BUILD_TRACKER_ONLINE': '1'
          'BUILD_TRACKER_REQUIRE_CHROME': '1'

  'workflow-lint':
    'name': 'Workflow Lint'
    'runs-on': 'ubuntu-latest'
    'steps':
      - 'uses': 'actions/checkout@v6'
      - 'id': 'actionlint'
        'shell': 'bash'
        'run': 'bash <(curl --fail --silent --show-error --location https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)'
      - 'run': '"${{ steps.actionlint.outputs.executable }}" -color .github/workflows/*.yml'

  'shell-lint':
    'name': 'Shell Lint'
    'runs-on': 'ubuntu-latest'
    'steps':
      - 'uses': 'actions/checkout@v6'

      - 'name': 'Install shellcheck'
        'run': 'sudo apt-get update && sudo apt-get install -y shellcheck'

      - 'name': 'Lint repo-owned shell scripts'
        'shell': 'bash'
        'run': |
          set -euo pipefail
          shopt -s nullglob
          repo_shell_scripts=(scripts/*.sh)
          if [ -f build-runtime-package.sh ]; then
            repo_shell_scripts+=(build-runtime-package.sh)
          fi
          if [ "${#repo_shell_scripts[@]}" -eq 0 ]; then
            echo "No repo-owned shell scripts found" >&2
            exit 1
          fi
          bash -n "${repo_shell_scripts[@]}"
          shellcheck "${repo_shell_scripts[@]}"

      - 'name': 'Lint the generated container setup script'
        'if': '${{ !cancelled() }}'
        'run': 'shellcheck installer/setup-container.sh'

      - 'name': 'Lint the cloud environment scripts'
        'if': '${{ !cancelled() }}'
        'run': 'shellcheck installer/cloud/setup-script.sh installer/cloud-session.sh'

  # The Gold Band headless proof (issue #447): the spec-stage template, and any
  # workflow beside it in installer/gold-band/workflows/, runs headless against
  # the stub agent on Linux and macOS. The Gold Band binary is supplied per OS
  # through repository variables (a URL and its SHA-256, so the build is
  # pinned); without one the job prints why and proves nothing, and a real run
  # of the workflow stays refused. docs/gold-band-proof.md.
  'gold-band-proof':
    'name': 'Gold Band Headless Proof'
    'strategy':
      'fail-fast': false
      'matrix':
        'include':
          - 'os': 'ubuntu-latest'
            'platform': 'linux'
            'suffix': 'LINUX'
            'url': '${{ vars.GOLD_BAND_BIN_URL_LINUX }}'
            'sha256': '${{ vars.GOLD_BAND_BIN_SHA256_LINUX }}'
          - 'os': 'macos-latest'
            'platform': 'macos'
            'suffix': 'MACOS'
            'url': '${{ vars.GOLD_BAND_BIN_URL_MACOS }}'
            'sha256': '${{ vars.GOLD_BAND_BIN_SHA256_MACOS }}'
    'runs-on': '${{ matrix.os }}'
    'env':
      'GOLD_BAND_COMMIT': '${{ vars.GOLD_BAND_COMMIT }}'
    'steps':
      - 'uses': 'actions/checkout@v6'
      - 'uses': 'JorisJonkers-dev/github-workflows/actions/setup-package-proxy@f8f0a5ae583913de18143bbbbe0db9ecab970435' # v0.45.0
        'with':
          'token': '${{ secrets.PACKAGES_PROXY_TOKEN }}'
          'require-package-proxy': 'true'
      # Cargo reads .cargo/config.toml from the working directory upward, and
      # the repository's points at a crate-gate that is not running here, so
      # the build runs from the runner's temp directory: resolution goes
      # through the packages proxy that setup-package-proxy configured.
      - 'name': 'Build the harness'
        'working-directory': '${{ runner.temp }}'
        'env':
          'CARGO_TARGET_DIR': '${{ runner.temp }}/proof-target'
          'CARGO_REGISTRIES_JORISJONKERS_PACKAGES_INDEX': 'sparse+https://packages.jorisjonkers.dev/cargo/'
          'CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS': 'cargo:token'
        'run': 'cargo build --locked --manifest-path "$GITHUB_WORKSPACE/scripts/Cargo.toml" -p gold-band-proof'
      - 'name': 'Fetch the supplied Gold Band binary'
        'env':
          'GOLD_BAND_URL': '${{ matrix.url }}'
          'GOLD_BAND_SHA256': '${{ matrix.sha256 }}'
        'run': |
          set -euo pipefail
          if [ -z "$GOLD_BAND_URL" ]; then
            echo "gold band: no binary supplied for ${{ matrix.platform }} (repository variable GOLD_BAND_BIN_URL_${{ matrix.suffix }} is empty); the headless proof is skipped"
            exit 0
          fi
          if [ -z "$GOLD_BAND_SHA256" ]; then
            echo "::error::a Gold Band binary URL is supplied for ${{ matrix.platform }} without its SHA-256"
            exit 1
          fi
          curl --fail --silent --show-error --location "$GOLD_BAND_URL" --output "$RUNNER_TEMP/gold-band"
          echo "$GOLD_BAND_SHA256  $RUNNER_TEMP/gold-band" | shasum -a 256 -c -
          chmod +x "$RUNNER_TEMP/gold-band"
          echo "GOLD_BAND_BIN=$RUNNER_TEMP/gold-band" >> "$GITHUB_ENV"
      - 'name': 'Prove every checked-in workflow headless'
        'run': |
          set -euo pipefail
          proof="$RUNNER_TEMP/proof-target/debug/gold-band-proof"
          commit_args=()
          [ -z "$GOLD_BAND_COMMIT" ] || commit_args=(--gold-band-commit "$GOLD_BAND_COMMIT")
          for workflow in installer/gold-band/workflows/*.json; do
            "$proof" prove --workflow "$workflow" --record-dir "$RUNNER_TEMP/proofs" ${commit_args[@]+"${commit_args[@]}"}
          done
      # A real run needs a recorded, passing proof: with the binary the check
      # passes, without it the skipped proof must refuse (exit 5).
      - 'name': 'A real run is allowed only after a passing proof'
        'run': |
          set -uo pipefail
          proof="$RUNNER_TEMP/proof-target/debug/gold-band-proof"
          expected=5
          [ -z "${GOLD_BAND_BIN:-}" ] || expected=0
          for workflow in installer/gold-band/workflows/*.json; do
            "$proof" check --workflow "$workflow" --record-dir "$RUNNER_TEMP/proofs" --build-record "$RUNNER_TEMP/none.json" && code=0 || code=$?
            if [ "$code" -ne "$expected" ]; then
              echo "::error::check of $workflow exited $code, expected $expected"
              exit 1
            fi
          done

  # The macOS write limit (ADR-0013, issue #434) can only be proven on macOS:
  # the launcher's enforcement tests start a stub agent under the real
  # sandbox-exec. Built from the runner's temp directory for the same reason
  # as the headless proof above (the repository's .cargo/config.toml names a
  # crate-gate that is not running here).
  'rust-macos':
    'name': 'Rust Tests (macos)'
    'runs-on': 'macos-latest'
    'steps':
      - 'uses': 'actions/checkout@v6'
      - 'uses': 'JorisJonkers-dev/github-workflows/actions/setup-package-proxy@f8f0a5ae583913de18143bbbbe0db9ecab970435' # v0.45.0
        'with':
          'token': '${{ secrets.PACKAGES_PROXY_TOKEN }}'
          'require-package-proxy': 'true'
      - 'name': 'Test the launcher and the code-nav read-reach proof on macOS'
        'working-directory': '${{ runner.temp }}'
        'env':
          'CARGO_TARGET_DIR': '${{ runner.temp }}/rust-target'
          'CARGO_REGISTRIES_JORISJONKERS_PACKAGES_INDEX': 'sparse+https://packages.jorisjonkers.dev/cargo/'
          'CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS': 'cargo:token'
        'run': 'cargo test --locked --manifest-path "$GITHUB_WORKSPACE/scripts/Cargo.toml" -p agent-launcher && cargo test --locked --manifest-path "$GITHUB_WORKSPACE/scripts/Cargo.toml" -p code-nav --test read_reach'

  # Holds a marketplace pin bump that adds code to run. Not in Pipeline
  # Complete, so it stops Renovate's automerge but not a reviewed manual merge.
  'marketplace-pins':
    'name': 'Marketplace Pin Review'
    'if': "github.event_name == 'pull_request'"
    'runs-on': 'ubuntu-latest'
    'env':
      'BASE_SHA': '${{ github.event.pull_request.base.sha }}'
    'steps':
      - 'uses': 'actions/checkout@v6'
      - 'uses': 'JorisJonkers-dev/github-workflows/actions/setup-package-proxy@8aaf024208bf4b29acb468aecd3cd7ee130d5ac1' # v0.49.1
        'with':
          'token': '${{ secrets.PACKAGES_PROXY_TOKEN }}'
          'require-package-proxy': 'true'
      - 'run': 'git fetch --quiet --depth 1 origin "${BASE_SHA}"'
      - 'uses': 'astral-sh/setup-uv@v8.2.0'
      - 'run': 'uv sync --frozen'
      - 'run': 'uv run python scripts/check_marketplace_bump.py --base-ref "${BASE_SHA}"'

  # The registry's NixOS package list names nixpkgs attributes by path. This
  # fails when one of them is not in the nixpkgs revision nixos-modules pins,
  # or is there but does not evaluate, so an upstream rename of a nixpkgs
  # package is caught here rather than on a machine. Entries packaged by
  # nixos-modules itself are checked by that flake's workstation example.
  'nixos-packages':
    'name': 'NixOS Package List'
    'runs-on': 'ubuntu-latest'
    'steps':
      - 'uses': 'actions/checkout@v6'
      - 'uses': 'cachix/install-nix-action@v31'
      # The list is generated by render_registry.py and must exist; a branch
      # that deletes it fails here instead of passing with nothing checked.
      - 'name': 'Require the generated list'
        'run': 'test -f registry/generated/nixos/packages.nix || { echo "::error::registry/generated/nixos/packages.nix is missing; run scripts/render_registry.py --write"; exit 1; }'
      # The list is only meaningful against the nixpkgs nixos-modules builds
      # its packages from, so the revision comes from that flake's lock file.
      - 'name': 'Read the nixpkgs revision nixos-modules pins'
        'run': |
          set -euo pipefail
          rev="$(curl -fsSL https://raw.githubusercontent.com/JorisJonkers-dev/nixos-modules/main/flake.lock \
            | jq -r '.nodes.nixpkgs.locked.rev')"
          if ! printf '%s' "${rev}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::nixos-modules' flake.lock names no valid nixpkgs revision: ${rev}"
            exit 1
          fi
          echo "NIXPKGS_REV=${rev}" >> "$GITHUB_ENV"
      - 'name': 'Check every nixpkgs attribute resolves and evaluates'
        'run': |
          set -euo pipefail
          nix --extra-experimental-features 'nix-command flakes' eval --json --impure \
            --expr "import ./scripts/check-nixos-packages.nix { nixpkgs = builtins.fetchTarball \"https://github.com/NixOS/nixpkgs/archive/${NIXPKGS_REV}.tar.gz\"; }" \
            > nixos-packages.json
          jq -r '.failures[]' nixos-packages.json | while read -r failure; do
            echo "::error::${failure}"
          done
          if [ "$(jq -r '.ok' nixos-packages.json)" != "true" ]; then
            echo "::error::$(jq -r '.failures | length' nixos-packages.json) of $(jq -r '.checked' nixos-packages.json) nixpkgs attributes failed"
            exit 1
          fi
          echo "All $(jq -r '.checked' nixos-packages.json) nixpkgs attributes resolve and evaluate."

  'pipeline-complete':
    'name': 'Pipeline Complete'
    'if': 'always()'
    'needs':
      - 'nixos-packages'
      - 'node'
      - 'python'
      - 'runtime-package'
      - 'shell-lint'
      - 'workflow-lint'
      - 'gold-band-proof'
      - 'rust-macos'
    'runs-on': 'ubuntu-latest'
    'steps':
      - 'uses': 're-actors/alls-green@release/v1'
        'with':
          'jobs': '${{ toJSON(needs) }}'
