'name': 'CI'

'on':
  'pull_request':
  'push':
    'branches':
      - 'main'
  'workflow_dispatch':

'concurrency':
  'group': 'ci-${{ github.workflow }}-${{ github.ref }}'
  'cancel-in-progress': '${{ github.ref != ''refs/heads/main'' }}'

'permissions':
  'contents': 'read'

'jobs':
  'python':
    'name': 'Python Lint / Typecheck / Tests'
    'runs-on': 'ubuntu-latest'
    'steps':
      - 'uses': 'actions/checkout@v6'
      - 'uses': 'JorisJonkers-dev/github-workflows/actions/setup-package-proxy@f8f0a5ae583913de18143bbbbe0db9ecab970435' # v0.45.0
        'with':
          'token': '${{ secrets.PACKAGES_PROXY_TOKEN }}'
          'require-package-proxy': 'true'
      - 'uses': 'astral-sh/setup-uv@v8.2.0'
      - 'run': 'uv sync --frozen'
      - 'run': 'uv run ruff check .'
      - 'run': 'uv run mypy'
      - 'run': 'uv run pytest'
      - 'run': 'uv run python scripts/check_skill_sources.py --validate'

  'runtime-package':
    'name': 'Runtime Package Contract'
    'runs-on': 'ubuntu-latest'
    'steps':
      - 'uses': 'actions/checkout@v6'
      - 'uses': 'JorisJonkers-dev/github-workflows/actions/setup-package-proxy@f8f0a5ae583913de18143bbbbe0db9ecab970435' # v0.45.0
        'with':
          'token': '${{ secrets.PACKAGES_PROXY_TOKEN }}'
          'require-package-proxy': 'true'
      - 'uses': 'astral-sh/setup-uv@v8.2.0'
      - 'run': 'uv sync --frozen'
      - 'run': 'uv run python scripts/render_agent_kit.py --check'
      - 'run': 'uv run python scripts/render_agent_kit.py --doctor'
      # The registry is the single source for the workstation setup script and
      # the two Hermes ConfigMap bodies. This fails on a hand edit to a
      # generated artifact and on a registry change that was never rendered.
      # `!cancelled()` so one failure still surfaces the rest: a job is billed
      # by the minute rounded up, so these belong as steps here rather than in
      # a job of their own.
      - 'run': 'uv run python scripts/render_registry.py --check'
        'if': '${{ !cancelled() }}'
      - 'run': 'bash -n installer/setup-workstation.sh'
        'if': '${{ !cancelled() }}'
      - 'run': 'bash -n installer/setup-container.sh'
        'if': '${{ !cancelled() }}'
      - 'run': 'bash -n scripts/sync-hermes-registry.sh'
        'if': '${{ !cancelled() }}'
      - 'run': 'scripts/build-runtime-package.sh v0.0.0-ci dist'
      - 'run': 'tar -tzf dist/agent-kit-runtime-home-v0.0.0-ci.tar.gz >/dev/null'

  'node':
    'name': 'Node CI'
    'runs-on': 'ubuntu-latest'
    'steps':
      - 'uses': 'actions/checkout@v6'
      - 'uses': 'JorisJonkers-dev/github-workflows/actions/setup-package-proxy@f8f0a5ae583913de18143bbbbe0db9ecab970435' # v0.45.0
        'with':
          'token': '${{ secrets.PACKAGES_PROXY_TOKEN }}'
          'require-package-proxy': 'true'
      - 'uses': 'actions/setup-node@v6'
        'with':
          'node-version': '22'
          'cache': 'npm'
          'cache-dependency-path': 'council/ts/package-lock.json'
      # The build tracker's online checks: the pinned Mermaid hash against
      # the CDN file, and the graph rendered from a local file in headless
      # Chrome. Opt-in on a workstation. The ubuntu runner image ships
      # google-chrome on PATH; BUILD_TRACKER_REQUIRE_CHROME makes the browser
      # tests fail rather than skip if it ever stops shipping one.
      - 'run': 'cd council/ts && npm ci && npm run build && npm test'
        'env':
          'BUILD_TRACKER_ONLINE': '1'
          'BUILD_TRACKER_REQUIRE_CHROME': '1'

  'workflow-lint':
    'name': 'Workflow Lint'
    'runs-on': 'ubuntu-latest'
    'steps':
      - 'uses': 'actions/checkout@v6'
      - 'id': 'actionlint'
        'shell': 'bash'
        'run': 'bash <(curl --fail --silent --show-error --location https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)'
      - 'run': '"${{ steps.actionlint.outputs.executable }}" -color .github/workflows/*.yml'

  'shell-lint':
    'name': 'Shell Lint'
    'runs-on': 'ubuntu-latest'
    'steps':
      - 'uses': 'actions/checkout@v6'

      - 'name': 'Install shellcheck'
        'run': 'sudo apt-get update && sudo apt-get install -y shellcheck'

      - 'name': 'Lint repo-owned shell scripts'
        'shell': 'bash'
        'run': |
          set -euo pipefail
          shopt -s nullglob
          repo_shell_scripts=(scripts/*.sh)
          if [ -f build-runtime-package.sh ]; then
            repo_shell_scripts+=(build-runtime-package.sh)
          fi
          if [ "${#repo_shell_scripts[@]}" -eq 0 ]; then
            echo "No repo-owned shell scripts found" >&2
            exit 1
          fi
          bash -n "${repo_shell_scripts[@]}"
          shellcheck "${repo_shell_scripts[@]}"

      - 'name': 'Lint the generated container setup script'
        'if': '${{ !cancelled() }}'
        'run': 'shellcheck installer/setup-container.sh'

      - 'name': 'Lint the cloud environment scripts'
        'if': '${{ !cancelled() }}'
        'run': 'shellcheck installer/cloud/setup-script.sh installer/cloud-session.sh'

  # Holds a marketplace pin bump that adds code to run. Not in Pipeline
  # Complete, so it stops Renovate's automerge but not a reviewed manual merge.
  'marketplace-pins':
    'name': 'Marketplace Pin Review'
    'if': "github.event_name == 'pull_request'"
    'runs-on': 'ubuntu-latest'
    'env':
      'BASE_SHA': '${{ github.event.pull_request.base.sha }}'
    'steps':
      - 'uses': 'actions/checkout@v6'
      - 'uses': 'JorisJonkers-dev/github-workflows/actions/setup-package-proxy@f8f0a5ae583913de18143bbbbe0db9ecab970435' # v0.45.0
        'with':
          'token': '${{ secrets.PACKAGES_PROXY_TOKEN }}'
          'require-package-proxy': 'true'
      - 'run': 'git fetch --quiet --depth 1 origin "${BASE_SHA}"'
      - 'uses': 'astral-sh/setup-uv@v8.2.0'
      - 'run': 'uv sync --frozen'
      - 'run': 'uv run python scripts/check_marketplace_bump.py --base-ref "${BASE_SHA}"'

  # The registry's NixOS package list names nixpkgs attributes by path. This
  # fails when one of them is not in the nixpkgs revision nixos-modules pins,
  # or is there but does not evaluate, so an upstream rename is caught here
  # rather than on a machine running setup.
  'nixos-packages':
    'name': 'NixOS Package List'
    'runs-on': 'ubuntu-latest'
    'steps':
      - 'uses': 'actions/checkout@v6'
      - 'uses': 'cachix/install-nix-action@v31'
      # The list is generated by another change, so a branch without it has
      # nothing to check and says so instead of failing.
      - 'name': 'Skip when the generated list is not on this branch'
        'id': 'packages-file'
        'run': |
          if [ -f registry/generated/nixos/packages.nix ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::registry/generated/nixos/packages.nix is not on this branch yet, so there is nothing to check."
          fi
      # The list is only meaningful against the nixpkgs nixos-modules builds
      # its packages from, so the revision comes from that flake's lock file.
      - 'name': 'Read the nixpkgs revision nixos-modules pins'
        'if': "steps.packages-file.outputs.present == 'true'"
        'run': |
          set -euo pipefail
          rev="$(curl -fsSL https://raw.githubusercontent.com/JorisJonkers-dev/nixos-modules/main/flake.lock \
            | jq -r '.nodes.nixpkgs.locked.rev')"
          if [ -z "${rev}" ] || [ "${rev}" = "null" ]; then
            echo "::error::nixos-modules' flake.lock names no nixpkgs revision"
            exit 1
          fi
          echo "NIXPKGS_REV=${rev}" >> "$GITHUB_ENV"
      - 'name': 'Check every nixpkgs attribute resolves and evaluates'
        'if': "steps.packages-file.outputs.present == 'true'"
        'run': |
          set -euo pipefail
          nix --extra-experimental-features 'nix-command flakes' eval --json --impure \
            --expr "import ./scripts/check-nixos-packages.nix { nixpkgs = builtins.fetchTarball \"https://github.com/NixOS/nixpkgs/archive/${NIXPKGS_REV}.tar.gz\"; }" \
            > nixos-packages.json
          jq -r '.failures[]' nixos-packages.json | while read -r failure; do
            echo "::error::${failure}"
          done
          if [ "$(jq -r '.ok' nixos-packages.json)" != "true" ]; then
            echo "::error::$(jq -r '.failures | length' nixos-packages.json) of $(jq -r '.checked' nixos-packages.json) nixpkgs attributes failed"
            exit 1
          fi
          echo "All $(jq -r '.checked' nixos-packages.json) nixpkgs attributes resolve and evaluate."

  'pipeline-complete':
    'name': 'Pipeline Complete'
    'if': 'always()'
    'needs':
      - 'nixos-packages'
      - 'node'
      - 'python'
      - 'runtime-package'
      - 'shell-lint'
      - 'workflow-lint'
    'runs-on': 'ubuntu-latest'
    'steps':
      - 'uses': 're-actors/alls-green@release/v1'
        'with':
          'jobs': '${{ toJSON(needs) }}'
