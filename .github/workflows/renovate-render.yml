'name': 'Renovate Render'

# Re-renders generated artifacts on a Renovate registry bump; the app token's push re-triggers CI.
'on':
  'pull_request':
    'paths':
      - 'registry/estate-tooling.yaml'

'permissions':
  'contents': 'read'

'jobs':
  'render':
    'name': 'Render registry artifacts'
    'if': >-
      github.event.pull_request.user.login == 'renovate[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    'runs-on': 'ubuntu-latest'
    'steps':
      - 'uses': 'actions/create-github-app-token@v3'
        'id': 'app-token'
        'with':
          'app-id': '${{ secrets.RELEASE_APP_ID }}'
          'private-key': '${{ secrets.RELEASE_APP_PRIVATE_KEY }}'
      - 'uses': 'actions/checkout@v6'
        'with':
          'ref': '${{ github.event.pull_request.head.ref }}'
          'token': '${{ steps.app-token.outputs.token }}'
      - 'uses': 'astral-sh/setup-uv@v8.2.0'
      - 'run': 'uv sync --frozen'
      - 'run': 'uv run python scripts/render_registry.py --write'
      - 'name': 'Commit rendered artifacts'
        'env':
          'APP_SLUG': '${{ steps.app-token.outputs.app-slug }}'
        'run': |
          if git diff --quiet; then
            echo "artifacts already current"
            exit 0
          fi
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          git commit -am "chore(registry): render artifacts for the updated pin"
          git push
