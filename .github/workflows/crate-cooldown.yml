'name': 'Crate Cooldown'

'on':
  'pull_request':
  'push':
    'branches':
      - 'main'
  'workflow_dispatch':

'concurrency':
  'group': 'crate-cooldown-${{ github.workflow }}-${{ github.ref }}'
  'cancel-in-progress': '${{ github.ref != ''refs/heads/main'' }}'

'permissions':
  'contents': 'read'

# The 7-day crate cooldown (the standards repo's ADR-0014; docs/RUST.md).
# This runs on every pull request, so every Cargo.toml or Cargo.lock change is
# covered (and a change to neither costs one cached build): crate-age refuses a
# change that adds or updates a crate version younger than seven days (exit 1)
# and one whose age cannot be proven (exit 2), failing this job either way.
# The pre-commit hook (.githooks/pre-commit) is the same check before the
# commit exists; this workflow is the gate a pull request cannot skip. The
# workspace then builds and tests with cargo resolving through the packages
# proxy, which hides versions younger than 7 days, and with cargo's own
# registry.global-min-publish-age from .cargo/config.toml (Rust 1.100 and later),
# the same wiring a workstation has.

'jobs':
  'crate-cooldown':
    'name': 'Crate Cooldown Gate (crate-age) and Rust Workspace'
    'runs-on': 'ubuntu-latest'
    # The proxy's cargo registry is authenticated: setup-package-proxy writes the
    # source replacement and exports the token; cargo also needs the registry
    # declared by name and told to read tokens from the environment.
    'env':
      'CARGO_REGISTRIES_JORISJONKERS_PACKAGES_INDEX': 'sparse+https://packages.jorisjonkers.dev/cargo/'
      'CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS': 'cargo:token'
    'steps':
      # agent-kit and the standards sources are siblings, never nested:
      # crate-age is built from the standards checkout with the packages proxy,
      # under the standards repo's own cargo configuration.
      - 'name': 'Check out agent-kit'
        'uses': 'actions/checkout@v6'
        'with':
          'path': 'agent-kit'
      # The standards repo is private, so reading it needs the release app,
      # which has to be installed on that repository. A token or checkout that
      # fails fails this job closed. crate-age is never copied into agent-kit;
      # the pin below is the commit scripts/install-crate-age.sh builds too. Move both together when the standards repo tags a release.
      - 'name': 'Mint a token to read the standards repo'
        'id': 'app-token'
        'uses': 'actions/create-github-app-token@v3'
        'with':
          'app-id': '${{ secrets.RELEASE_APP_ID }}'
          'private-key': '${{ secrets.RELEASE_APP_PRIVATE_KEY }}'
          'owner': '${{ github.repository_owner }}'
          'repositories': 'standards'
      - 'name': 'Check out the standards repo (crate-age source)'
        'uses': 'actions/checkout@v6'
        'with':
          'repository': 'JorisJonkers-dev/standards'
          'ref': '7d0673432f10f4a515a5dc700f78daae8e389cd5'
          'path': 'standards'
          'token': '${{ steps.app-token.outputs.token }}'
          'persist-credentials': false
      - 'uses': 'JorisJonkers-dev/github-workflows/actions/setup-package-proxy@48fcba8b143567e12716f4b77b9a3ab211719ffd' # v0.50.1
        'with':
          'token': '${{ secrets.PACKAGES_PROXY_TOKEN }}'
          'require-package-proxy': 'true'
      # registry.global-min-publish-age is honoured from Rust 1.100; an older
      # runner image would ignore it with a warning.
      - 'name': 'Rust 1.100 or newer (the cargo cooldown)'
        'run': |
          rustup update stable --no-self-update
          rustup default stable
          minor=$(rustc --version | sed -n 's/^rustc 1\.\([0-9][0-9]*\)\..*/\1/p')
          [ "${minor:-0}" -ge 100 ] || { echo "rustc $(rustc --version) is older than 1.100" >&2; exit 1; }
      - 'name': 'Build crate-age'
        'working-directory': 'standards/scripts'
        'run': 'cargo build --release --locked --bin crate-age'

      # crate-age's command line is owned by the standards repo
      # (scripts/README.md there); this gate points it at the checkout.
      - 'name': 'Run crate-age over the checkout'
        'run': 'standards/scripts/target/release/crate-age --root agent-kit'

      # Resolution goes through the packages proxy that setup-package-proxy
      # configured (it hides versions younger than 7 days), with cargo's own
      # cooldown from .cargo/config.toml on top.
      - 'name': 'Build the workspace'
        'working-directory': 'agent-kit'
        'run': 'cargo build --locked --manifest-path scripts/Cargo.toml'
      - 'name': 'Test the workspace'
        'working-directory': 'agent-kit'
        'run': 'cargo test --locked --manifest-path scripts/Cargo.toml'
      # Every skill, hook, role file and MCP server has exactly one target
      # and its lanes in docs/gold-band-port-inventory.md (spec #392).
      - 'name': 'Check the Gold Band port inventory'
        'working-directory': 'agent-kit'
        'run': 'cargo run --locked --manifest-path scripts/Cargo.toml -p inventory-check -- .'

      # The reach-level support record: every id names a level, its agent
      # can hold it on each OS it runs on, and research and write-scoped ids
      # carry an output directory (docs/REGISTRY.md).
      - 'name': 'Validate the reach-level support record'
        'working-directory': 'agent-kit'
        'run': 'cargo run --locked --manifest-path scripts/Cargo.toml -p agent-launcher -- validate registry/reach-levels.yaml'

      # Line coverage of the workspace must stay at 100 percent (docs/RUST.md).
      # rustc's own instrumentation plus the llvm-tools component of the same
      # toolchain, so no further crate is involved and the profile format
      # always matches. src/main.rs exit wrappers are excluded.
      - 'name': 'Rust line coverage is 100 percent'
        'working-directory': 'agent-kit'
        'run': |
          rustup component add llvm-tools
          scripts/coverage.sh
