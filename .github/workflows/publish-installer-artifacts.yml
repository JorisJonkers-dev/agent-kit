'name': 'Publish Installer Artifacts'

# Publishes setup-workstation.sh and the skills bundle to the estate's public
# static host on every published release. install.sh and install-agents.sh
# are retired by #40 and are never published from here.
'on':
  'release':
    'types':
      - 'published'

'permissions':
  'contents': 'read'

'jobs':
  'publish':
    'name': 'Publish to the static host'
    'runs-on': 'ubuntu-latest'
    # One job with many steps: three uploads split across three jobs would
    # triple the bill for identical work, since jobs are billed by the
    # minute, rounded up. Every step past staging carries
    # `if: ${{ !cancelled() }}` so one failed upload or check still lets the
    # rest run and report.
    'env':
      'TAG_NAME': '${{ github.event.release.tag_name }}'
      'STAGE_DIR': '${{ github.workspace }}/.publish-stage'
      'S3_ENDPOINT': '${{ secrets.GARAGE_S3_ENDPOINT }}'
      'GARAGE_ACCESS_KEY_ID': '${{ secrets.GARAGE_ASSETS_ACCESS_KEY_ID }}'
      'GARAGE_SECRET_ACCESS_KEY': '${{ secrets.GARAGE_ASSETS_SECRET_ACCESS_KEY }}'
    'steps':
      - 'uses': 'actions/checkout@v6'
        'with':
          'ref': '${{ github.event.release.tag_name }}'

      - 'name': 'Stage the script and the skills bundle'
        'run': 'scripts/publish-installer-artifacts.sh stage'

      - 'name': 'Upload setup-workstation.sh'
        'if': '${{ !cancelled() }}'
        'run': 'scripts/publish-installer-artifacts.sh upload-script'

      - 'name': 'Upload the skills bundle'
        'if': '${{ !cancelled() }}'
        'run': 'scripts/publish-installer-artifacts.sh upload-skills'

      - 'name': 'Upload the skills bundle checksum'
        'if': '${{ !cancelled() }}'
        'run': 'scripts/publish-installer-artifacts.sh upload-checksum'

      - 'name': 'Verify setup-workstation.sh is served with the release version'
        'if': '${{ !cancelled() }}'
        'run': 'scripts/publish-installer-artifacts.sh verify-script'

      - 'name': 'Verify the skills bundle matches its checksum'
        'if': '${{ !cancelled() }}'
        'run': 'scripts/publish-installer-artifacts.sh verify-skills'

      - 'name': 'Verify the published checksum file'
        'if': '${{ !cancelled() }}'
        'run': 'scripts/publish-installer-artifacts.sh verify-checksum'

      - 'name': 'Verify the retired installers are not published'
        'if': '${{ !cancelled() }}'
        'run': 'scripts/publish-installer-artifacts.sh verify-retired-absent'
