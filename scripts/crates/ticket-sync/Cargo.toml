[package]
name = "ticket-sync"
version = "0.1.0"
edition = "2021"
publish = false
description = "Plans (dry run) and applies the spec ticket graph to GitHub issues."

# Registry dependencies are pinned exactly (docs/RUST.md).
[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
serde_yaml = "=0.9.34"
