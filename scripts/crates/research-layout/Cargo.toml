[package]
name = "research-layout"
version = "0.1.0"
edition = "2021"
publish = false
description = "Keeps a papers directory honest: checks catalog, notes and quotes, regenerates the INDEX.md files, and mounts the papers repository as a submodule (issue #356)."

# Only the two pinned, cooldown-old crates the task names; everything else
# is std (standards ADR-0014, docs/RUST.md).
[dependencies]
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
