[package]
name = "research-layout"
version = "0.1.0"
edition = "2021"
publish = false
description = "Validates and re-indexes the papers directory of the private research repository, fetches Workflow A's public sources into stored pages, and verifies that every quote a run added is on the page as fetched (issues #356 and #456)."

# serde and serde_json are pinned to the versions the other members share
# (older than the 7-day crate cooldown, docs/RUST.md), so the lockfile gains
# no registry version. The path dependency stays inside this workspace: the
# SHA-256 comes from gold-band-report.
[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
gold-band-report = { path = "../gold-band-report" }

# The verifier runs behind the gate shim in Workflow A; the integration test
# drives it through the shim's own library, inside this workspace.
[dev-dependencies]
gold-band-gate = { path = "../gold-band-gate" }
