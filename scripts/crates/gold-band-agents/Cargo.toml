[package]
name = "gold-band-agents"
version = "0.1.0"
edition = "2021"
publish = false
description = "The Gold Band agent registry: validates Gold Band agent declarations, converges settings.json onto them, and launches one declared agent behind the reach rules."

# The only dependencies allowed, pinned exact; both are far older than the
# 7-day crate cooldown (the standards repo's ADR-0014, docs/RUST.md; the same
# pair crates/research-layout pins). preserve_order keeps settings.json's key
# order, which the convergence promises to leave alone. Everything else is
# std. A git or path dependency outside this workspace is never allowed; a
# shared crate joins the workspace as a new member instead.
[dependencies]
serde = "=1.0.229"
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
