[package]
name = "gold-band-run-start"
version = "0.1.0"
edition = "2021"
publish = false
description = "The run-start shim every Gold Band workflow opens with: repository rule, family allowlist and grant checks before any model node runs (issue #444)."

# serde_json is the one registry dependency, pinned to the exact version the
# other members share (older than the 7-day crate cooldown, standards
# ADR-0014, docs/RUST.md). The path dependency stays inside this workspace.
[dependencies]
gold-band-report = { path = "../gold-band-report" }
serde_json = "=1.0.154"
