[package]
name = "model-family"
version = "0.1.0"
edition = "2021"
publish = false
description = "Resolves the model family of an agent id and model id from the critique routing file, shared by workflow-lint and the run-start shim (issue #783)."

# serde_json is the one registry dependency, pinned to the exact version the
# other members share (older than the 7-day crate cooldown, standards
# ADR-0014, docs/RUST.md).
[dependencies]
serde_json = "=1.0.154"
