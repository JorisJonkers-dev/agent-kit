[package]
name = "gold-band-allowlist"
version = "0.1.0"
edition = "2021"
publish = false
description = "The Gold Band family allowlist check: one repository entry against every workflow, at setup and again at each run start (issue #352)."

# The only dependencies allowed, pinned exact; both are far older than the
# 7-day crate cooldown (standards ADR-0014, docs/RUST.md). Everything else
# is std.
[dependencies]
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
