[package]
name = "ci-wait"
version = "0.1.0"
edition = "2021"
publish = false
description = "Waits until every CI check of one commit is terminal and prints one JSON verdict."

# Registry dependencies are pinned exactly, each at a version at least seven
# days old (docs/RUST.md); crate-age checks every transitive version.
[dependencies]
serde_json = "=1.0.154"
serde_yaml = "=0.9.34"
