[package]
name = "gold-band-roles"
version = "0.1.0"
edition = "2021"
publish = false
description = "Renders the critique pipeline's role and lens files into the six Gold Band profiles and converges the profiles directory (#345)."

# std only, by design. Adding any dependency puts the 7-day crate cooldown in
