# The estate's Rust goes in ONE cargo workspace, with ONE lockfile at
# scripts/Cargo.lock (the standards repo's ADR-0014; see docs/RUST.md).
#
members = [
    "crates/agent-kit-setup",
    "crates/gold-band-allowlist",
    "crates/gold-band-registry",
    "crates/inventory-check",
    "crates/research-layout",
    "crates/ticket-export",
    "crates/workflow-lint",
]
# (127.0.0.1:17342, configured in ~/.cargo/config.toml), which hides any
# version younger than 7 days; crate-age is the after-the-fact check, wired
# into this repository's pre-commit hook and pull-request workflow.

[workspace]
resolver = "2"
members = [
    "crates/agent-kit-setup",
    "crates/gold-band-allowlist",
    "crates/gold-band-registry",
    "crates/inventory-check",
    "crates/research-layout",
    "crates/ticket-export",
    "crates/workflow-lint",
]
