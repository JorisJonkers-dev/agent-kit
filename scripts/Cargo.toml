# The estate's Rust goes in ONE cargo workspace, with ONE lockfile at
# scripts/Cargo.lock (the standards repo's ADR-0014; see docs/RUST.md).
#
# Every member is std-only today except `crates/workflow-lint`, which pins
# the one dependency its task allowed (serde_json 1.0.140, already older
# than the 7-day crate cooldown); no member has a git or path dependency at
# all, but serde_json brings transitive registry versions into
# scripts/Cargo.lock (itoa, memchr, proc-macro2, quote, ryu, serde,
# serde_core, serde_derive, syn, unicode-ident), all of which crate-age
# checks along with serde_json itself, so the lockfile does hold further
# ages the cooldown could question. On a workstation, cargo resolves
# through the crate-gate
# (127.0.0.1:17342, configured in ~/.cargo/config.toml), which hides any
# version younger than 7 days; crate-age is the after-the-fact check, wired
# into this repository's pre-commit hook and pull-request workflow.

[workspace]
resolver = "2"
members = ["crates/agent-kit-setup", "crates/gold-band-registry", "crates/inventory-check", "crates/ticket-export", "crates/workflow-lint"]
