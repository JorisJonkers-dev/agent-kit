# The estate's Rust goes in ONE cargo workspace, with ONE lockfile at
# scripts/Cargo.lock (the standards repo's ADR-0014; see docs/RUST.md).
#
# agent-kit-setup is the std-only canary: nothing in the lockfile comes from a
# registry. A member that takes a registry dependency pins it exactly. No member
# has a git or path dependency outside this workspace. cargo resolves through
# the packages proxy.

[workspace]
resolver = "2"
members = [
    "crates/agent-kit-setup",
    "crates/inventory-check",
    "crates/litellm-gate",
    "crates/gold-band-registry",
    "crates/code-nav-eval",
    "crates/code-nav",
    "crates/model-family",
    "crates/workflow-lint",
    "crates/ticket-sync",
    "crates/gold-band-proof",
    "crates/transcript-mix",
    "crates/agent-launcher",
    "crates/build-tracker",
    "crates/ticket-export",
    "crates/ci-wait",
    "crates/gold-band-report",
    "crates/gold-band-run-start",
    "crates/gold-band-gate",
    "crates/coverage-gate",
    "crates/gold-band-findings",
    "crates/ticket-publish",
    "crates/model-gateway",
    "crates/critique",
    "crates/memory-bank",
    "crates/research-layout",
    "crates/rust-migration-guard",
    "crates/critique-block",
    "crates/estate",
    "crates/projects-layout-guard",
    "crates/pr-composer",
    "crates/ci-helpers",
]
