## Upgrade Procedure

1. Verify each upstream repository remains reachable and MIT licensed.
2. Refresh only the skill material intentionally adapted into this repo.
3. Record any unreachable or unlicensed source under "Skipped Sources".
4. Re-run hygiene checks before updating this lock.
