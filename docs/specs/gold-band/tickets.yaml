  - mac
  what: One cargo workspace in agent-kit, with crate-gate resolving every cargo command and crate-age failing closed in the pre-commit hook and the pull-request workflow. Reuse the workspace landed on the old integration branch (#383) and make it run on the Linux workstation.
  ac:
  - With crate-gate's replacement source removed from the cargo configuration, a cargo build in the workspace on Linux fails to resolve; with it present, the build resolves only through crate-gate.
  - A commit that adds a crate younger than 7 days is refused by the pre-commit hook and by CI (exit 1); a crate whose age cannot be proven exits 2.
  - CI runs crate-age on every Cargo.toml or Cargo.lock change.
