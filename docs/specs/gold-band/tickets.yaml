# Ticket graph for spec #392. This file is the source; GitHub is generated
# from it. `issue` records the published number. `supersedes` lists the old
# issues each ticket replaces; they are closed by B0-06 after owner approval.
spec: 392
labels:
- ready-for-agent
- 'area: agents'
branches:
  B0:
    title: B0 Foundations
    issue: 403
    what: The Rust workspace and cooldown on Linux, the pinned Gold Band build on both OSes, the re-verified Gold Band facts, the ticket sync tool, the tracker and the closing of superseded issues.
  B1:
    title: B1 Instances and setup
    issue: 404
    what: 'The two Gold Band instances converged by setup on each OS: registry model and overlay, isolation and the second macOS user, the secret store, agents and launchers, reach levels and both write-limit backends, skill sets, roles and MCP servers.'
  B2:
    title: B2 Gold Band workflows
    issue: 405
    what: The run-start, grant-check and gate shims, Workflows A, B and C in personal and work variants, the workflow lint, headless proofs, LiteLLM budgets, the per-repository setup file and the CI-wait gate.
  B3:
    title: B3 Port
    issue: 406
    what: The port inventory with lanes, the Wave 2 critique templates, the estate skills replacing the six old repo skills, and the later waves cut from the inventory.
  B4:
    title: B4 Direct lane
    issue: 407
    what: The review stages and refactoring-plan stage finished in the critique runner, the work-only critic roster, the remaining live checks, model-gateway fixes, the in-cluster runner, the research front door and the Rust port of the Node runners.
  B5:
    title: B5 Memory
    issue: 408
    what: The Nedap bank, the migration of employer facts out of Shared Memory and Private Memory, and the recall checks.
  B6:
    title: B6 Workstation and hygiene
    issue: 409
    what: 'Workstation tooling and repository hygiene that sit outside Gold Band: Playwright, OpenCode parity, container language servers, SSO install, github MCP, kubeconfig helper, package cooldowns, the dependency queue, the attribution guard follow-ups and the setup wrapper.'
  B7:
    title: B7 Code navigation
    issue: 410
    what: Measure how agents find code, give every repository an AGENTS.md, build the read-only code-navigation server, and add an index only when measurements show it is needed.
