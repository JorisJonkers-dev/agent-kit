# The 7-day crate cooldown (the standards repo's ADR-0014; docs/RUST.md).
# From Rust 1.100 cargo's resolver skips any version published less than 7 days
# ago unless Cargo.lock already holds it. Setup writes the same setting into
# ~/.cargo/config.toml, and the packages proxy (packages.jorisjonkers.dev/cargo),
# which every workstation and CI job resolves through, hides those versions too.
# crate-age is the after-the-fact check of Cargo.lock in the pre-commit hook and
# the Crate Cooldown workflow.

[registry]
global-min-publish-age = "7 days"
